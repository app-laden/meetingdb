<title>meetingdb</title>
<style>
:root{
  --blue:#215aa5; --blue-dark:#17407a; --bg:#f4f6f8; --card:#ffffff;
  --border:#dde3e8; --text:#1d2630; --muted:#66747f; --danger:#b23b3b;
  --danger-bg:#fbeaea; --green:#2e8f5a; --tag-bg:#e8eef6;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45;}
body{padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  padding-left:var(--safe-l); padding-right:var(--safe-r);}
a{color:var(--blue);}
h1,h2,h3{margin:0 0 10px 0; line-height:1.25;}
h1{font-size:1.4rem;} h2{font-size:1.1rem;} h3{font-size:1rem;}
#topbar{position:sticky; top:0; z-index:20; background:var(--blue); color:#fff;
  padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
  margin-top:calc(-1 * var(--safe-t));
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
#topbar .brand{font-weight:600; font-size:1.05rem; margin-right:auto;}
#topbar button, #topbar .pill{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.4);
  border-radius:16px; padding:6px 12px; font-size:.85rem; cursor:pointer;}
#topbar button:hover{background:rgba(255,255,255,.24);}
nav#tabs{display:flex; gap:4px; overflow-x:auto; background:var(--blue-dark); padding:0 calc(10px + var(--safe-l));
  position:sticky; top:0; z-index:19;}
nav#tabs button{background:none; border:none; color:#dce8f8; padding:10px 12px; font-size:.88rem;
  cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;}
nav#tabs button.active{color:#fff; border-bottom-color:#fff; font-weight:600;}
#updatebar{display:none; background:#2e8f5a; color:#fff; text-align:center; padding:8px; font-size:.9rem; cursor:pointer;}
#app{max-width:900px; margin:0 auto; padding:14px calc(14px + var(--safe-r)) 40px calc(14px + var(--safe-l));}
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;}
.muted{color:var(--muted);}
.small{font-size:.85rem;}
.row{display:flex; gap:10px; align-items:end; flex-wrap:wrap;}
.row > *{flex:1; min-width:140px;}
.btn-row{display:flex; flex:none; gap:8px; flex-wrap:wrap;}
label{display:block; font-size:.82rem; color:var(--muted); margin-bottom:3px;}
input[type=text], input[type=date], input[type=number], input[type=password], input[type=search],
select, textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:.95rem;
  background:#fff; color:var(--text); font-family:inherit;}
textarea{resize:none; overflow-y:hidden; min-height:2.4em;}
button, .btn{display:inline-block; background:var(--blue); color:#fff; border:none; border-radius:6px;
  padding:5px 10px; font-size:.82rem; cursor:pointer; text-decoration:none;}
button:hover, .btn:hover{background:var(--blue-dark);}
button.secondary, .btn.secondary{background:#eef1f4; color:var(--text); border:1px solid var(--border);}
button.secondary:hover{background:#e3e8ed;}
button.danger{background:var(--danger-bg); color:var(--danger); border:1px solid #f0c7c7;}
button.danger:hover{background:#f6dada;}
button:disabled{opacity:.5; cursor:default;}
.list-item{border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:#fbfcfd;}
.actions{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
.tag{display:inline-block; background:var(--tag-bg); color:var(--blue-dark); border-radius:12px;
  padding:2px 10px; font-size:.78rem; margin-left:6px;}
.tag.status{background:#fff3da; color:#8a5a00;}
.tag.done{background:#e3f4e9; color:var(--green);}
details{margin-top:8px;}
summary{cursor:pointer; font-size:.88rem;}
/* Kleiner Button statt Aufklapp-Dreieck fuer auf-/zuklappbare Abschnitte
   (seit 1.7.0, seit 1.8.0 auch fuer den kombinierten TOP-Detailbutton in der
   Liste und das Verschieben-Formular) */
summary.btn-toggle{display:inline-block; background:#eef1f4; color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:4px 10px; font-size:.8rem; list-style:none;}
summary.btn-toggle::-webkit-details-marker{display:none;}
summary.btn-toggle .lbl-open{display:none;}
details[open] > summary.btn-toggle .lbl-closed{display:none;}
details[open] > summary.btn-toggle .lbl-open{display:inline;}
hr{border:none; border-top:1px solid var(--border); margin:14px 0;}
.top-block{border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:28px; background:#fff;}
.top-block.sub{margin-left:26px; border-left:3px solid var(--blue);}
.top-block.done{background:#f7fbf8; border-color:#cfe8d8;}
.top-block.done .top-title{opacity:.75;}
/* TOPs, die nicht mehr "normal" sind (verschoben oder gestrichen), werden
   grau/blass dargestellt (Version 1.8.0) - ueber "zuruecksetzen auf normal"
   wieder normal. */
.top-block.inactive{opacity:.55; background:#f5f5f5;}
.btn-done{width:30px; padding:4px 0; text-align:center; font-size:1rem; line-height:1;}
.btn-done.active{background:#e3f4e9; color:var(--green); border-color:#bfe2cc;}
.btn-timer.active{background:#fff3da; color:#8a5a00; border-color:#e0c48c;}
.top-block .top-title{font-weight:600; margin-bottom:4px;}
/* Zweigeteilte Sitzungsansicht (Version 1.9.0): links eine schlanke,
   immer sichtbare TOP-Uebersicht, rechts der jeweils ausgewaehlte TOP in
   voller Ausfuehrlichkeit - beide unabhaengig voneinander scrollbar, damit
   auch Agenden mit vielen TOPs auf einen Blick uebersichtlich bleiben. Der
   Versatz oben (--split-top) wird per JS anhand der tatsaechlichen Hoehe von
   #topbar + nav#tabs ermittelt (SV.ui.renderTabs), 92px ist nur ein
   Startwert, bevor das zum ersten Mal berechnet wurde. */
.meeting-split{display:flex; gap:14px; align-items:flex-start; margin-top:14px;}
.split-left{flex:0 0 280px; min-width:220px; max-width:320px;}
.split-right{flex:1 1 auto; min-width:0;}
.split-left, .split-right{position:sticky; top:var(--split-top, 92px);
  max-height:calc(100vh - var(--split-top, 92px) - 14px); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.split-right-empty{color:var(--muted); text-align:center; padding:40px 16px;}
.top-row{border:1px solid var(--border); border-radius:8px; padding:7px 9px; margin-bottom:7px; background:#fff;}
.top-row.sub{margin-left:16px; border-left:3px solid var(--blue);}
.top-row.done{background:#f7fbf8; border-color:#cfe8d8;}
.top-row.inactive{opacity:.55; background:#f5f5f5;}
.top-row.selected{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; background:#eef4fb;}
/* Eigene, schmale Flex-Zeile statt der allgemeinen ".row"-Klasse (deren
   ".row > *{min-width:140px}" fuer Formularfelder gedacht ist und die
   kompakte TOP-Zeile sonst sprengen wuerde). */
.top-row-head{display:flex; align-items:center; flex-wrap:nowrap; gap:6px;}
.top-row-head > .trh-num{flex:0 0 auto; font-weight:600; min-width:22px; font-size:.85rem;}
.top-row-head > .trh-done{flex:0 0 auto;}
.top-row-head > .trh-title{flex:1 1 auto; min-width:0;}
.top-row-title{font-weight:600; text-decoration:none; font-size:.92rem; display:block;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.top-row-title:hover{text-decoration:underline;}
.top-row-actions{display:flex; gap:3px; flex:0 0 auto;}
.top-row-actions button{padding:3px 7px; font-size:.8rem;}
.top-row .move-form{margin-top:4px;}
.top-row .move-form summary.btn-toggle{padding:2px 7px; font-size:.74rem;}
@media (max-width:760px){
  .meeting-split{display:block;}
  .split-left, .split-right{position:static; max-height:none; overflow:visible; max-width:none; min-width:0;}
  .meeting-split:not(.has-selection) .split-right{display:none;}
  .meeting-split.has-selection .split-left{display:none;}
}
.block-bullets{list-style:disc; margin:4px 0 4px 20px; padding:0;}
.block-bullets li{margin-bottom:4px;}
.block-sublist{list-style:none; margin:2px 0; padding:0; text-indent:-14px; padding-left:14px;}
.toolbar{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
.center{text-align:center;}
#helpdlg{max-width:640px; width:92vw;}
#helpdlg::backdrop{background:rgba(0,0,0,.45);}
dialog{border:none; border-radius:10px; padding:0; box-shadow:0 8px 30px rgba(0,0,0,.25);}
.dlg-body{padding:16px; max-height:75vh; overflow:auto;}
.dlg-tabs{display:flex; border-bottom:1px solid var(--border);}
.dlg-tabs button{flex:1; background:none; color:var(--text); border-radius:0; border-bottom:3px solid transparent;}
.dlg-tabs button.active{border-bottom-color:var(--blue); font-weight:600; background:none; color:var(--blue);}
.pdf-opts{display:flex; gap:14px; flex-wrap:wrap; margin:8px 0;}
.lock-icon{opacity:.75;}
table.plain{width:100%; border-collapse:collapse; font-size:.85rem;}
table.plain th, table.plain td{border:1px solid var(--border); padding:4px 6px; text-align:left; vertical-align:top;}
@media (max-width:480px){
  #app{padding-left:10px; padding-right:10px;}
  .row > *{min-width:100%;}
}
</style>
</head>

/* ===================== Sprache / Übersetzung (i18n) =====================
   Deutsch ist und bleibt die Referenzsprache (DICT.de); Englisch ist eine
   zusätzliche, vollständige Übersetzung der kompletten Oberfläche (Nav,
   Hilfe, alle Formulare/Buttons/Labels, Meldungen, PDF-Beschriftungen).
   Gespeicherte Fachdaten (Titel, Texte, die Nutzer selbst eingegeben haben)
   werden NIE übersetzt - nur die App-eigene Beschriftung. */
SV.i18n = {
  STORAGE_KEY: "mdb-lang",
  lang: "de",
  init(){
    try{
      const saved = localStorage.getItem(SV.i18n.STORAGE_KEY);
      if(saved==="en" || saved==="de") SV.i18n.lang = saved;
    }catch(e){}
    SV.i18n.apply();
  },
  setLang(lang){
    SV.i18n.lang = (lang==="en") ? "en" : "de";
    try{ localStorage.setItem(SV.i18n.STORAGE_KEY, SV.i18n.lang); }catch(e){}
    SV.i18n.apply();
    SV.router.go();
  },
  toggle(){ SV.i18n.setLang(SV.i18n.lang==="de" ? "en" : "de"); },
  // Aktualisiert die statischen Chrome-Elemente, die NICHT durch SV.router.go()
  // neu gerendert werden (liegen ausserhalb von #app/#tabs).
  apply(){
    document.documentElement.lang = SV.i18n.lang;
    const btn = SV.util.byId("langBtn");
    if(btn){
      btn.textContent = SV.i18n.lang==="de" ? "EN" : "DE";
      btn.title = SV.i18n.lang==="de" ? "Switch to English" : "Auf Deutsch umschalten";
    }
    const ub = SV.util.byId("updatebar");
    if(ub) ub.textContent = SV.t("updatebar_text");
    const hc = SV.util.byId("helpCloseBtn");
    if(hc) hc.textContent = SV.t("help_close");
  },
  t(key, ...args){
    let s = (SV.i18n.DICT.en && SV.i18n.lang==="en" && SV.i18n.DICT.en[key] !== undefined) ? SV.i18n.DICT.en[key] : SV.i18n.DICT.de[key];
    if(s === undefined) s = key;
    args.forEach((a,i)=>{ s = s.split("{"+i+"}").join(a); });
    return s;

      help_tab_ueber: "Über diese App",
      help_html_bedienung: `
        <h3>Teams</h3>
        <p>Jedes Team speichert seine Daten getrennt, nur auf diesem Gerät. Optional mit Passwort schützbar – oben rechts kann man das Team wechseln bzw. sich abmelden.</p>
        <h3>Agenden &amp; Sitzungen</h3>
        <p>Eine Agenda ist eine Vorlage mit Tagesordnungspunkten (Titel immer Pflicht, Datum optional – zum Termine-Planen). Mit "Sitzung starten" wird daraus eine laufende Sitzung – die Agenda selbst bleibt dabei unverändert als Vorlage bestehen und erscheint danach im Bereich "Alte Agenden".</p>
        <p>Tagesordnungspunkte lassen sich mit ← / → eine Ebene höher/tiefer stufen, in laufenden Sitzungen zusätzlich mit ↑ / ↓ verschieben. Innerhalb eines Punkts: Textblöcke (mit "-" oder "1., 2., ..." für Aufzählungen, auch verschachtelt), Anträge/Beschlüsse mit Abstimmungsergebnis, und Aufgaben mit Verantwortlichem und Termin.</p>
        <h3>Abschließen &amp; wieder öffnen</h3>
        <p>"Sitzung abschließen" sperrt das Protokoll gegen versehentliches Bearbeiten. Für nachträgliche Korrekturen lässt es sich über "Protokoll wieder öffnen" erneut bearbeitbar machen.</p>
        <h3>Beschlussliste &amp; Aufgaben</h3>
        <p>Die Beschlussliste zeigt alle Anträge/Beschlüsse des aktuellen Teams. Die Aufgabenliste zeigt Aufgaben teamübergreifend (über alle entsperrten Teams) mit Filtern, Status/Termin direkt bearbeitbar, und PDF-Export (Hoch-/Querformat wählbar).</p>
        <h3>Sprache</h3>
        <p>Oben rechts lässt sich die Oberfläche zwischen Deutsch und Englisch umschalten (DE/EN-Taste). Die Einstellung wird auf diesem Gerät gespeichert. Bereits eingegebene Texte werden dabei nicht übersetzt.</p>
      `,
      help_html_installation: `<p>Diese App lässt sich wie eine normale App installieren:</p>
      <p><strong>iPad/iPhone:</strong> Seite in Safari öffnen → Teilen □↑ → „Zum Home-Bildschirm" → Hinzufügen.</p>
      <p><strong>Mac:</strong> Safari → Ablage → „Zum Dock hinzufügen" (ab macOS Sonoma), oder Lesezeichen.</p>
      <p><strong>Android:</strong> In Chrome öffnen → ⋮ → „App installieren".</p>
      <p><strong>Windows:</strong> Edge/Chrome → Installieren-Symbol in der Adressleiste.</p>
      <p class="muted small">Nach einem Update erscheint oben eine grüne Leiste „Neue Version bereit" – zum Übernehmen antippen.</p>`,
      help_html_datenschutz: `
      <p>Alle Eingaben (Teams, Agenden, Sitzungen, Beschlüsse, Aufgaben) bleiben ausschließlich auf diesem Gerät, im Speicher dieses Browsers – es gibt keinen Server, der diese Daten sieht. Die Seite wird bei GitHub gehostet, das beim Aufruf technische Daten (z.B. IP-Adresse) verarbeitet.</p>
      <p>Passwortgeschützte Teams werden mit einem aus dem Passwort abgeleiteten Schlüssel (PBKDF2 + AES-GCM) im Browser verschlüsselt gespeichert. Das Passwort selbst wird nirgends gespeichert.</p>
      <p>Es gibt keine automatische Synchronisation zwischen Geräten. Über "Datensicherung" lässt sich der Datenbestand bewusst als Datei exportieren/importieren.</p>
      <p>Diese App wird ohne Gewähr bereitgestellt; für Datenverlust (z.B. durch Löschen des Browser-Speichers) wird keine Haftung übernommen – regelmäßige Datensicherung wird empfohlen.</p>
    `,
      help_html_ueber: `<p>Private, kostenlose App ohne Werbung. Kontakt und Rückmeldungen: github.com/app-laden.</p><p class="muted small">Version ${SV.VERSION}</p>`,
    },

/* ===================== util ===================== */
SV.util = {
  uuid(){
    if (crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c=>{
      const r = Math.random()*16|0, v = c==="x"?r:(r&0x3|0x8); return v.toString(16);
    });
  },
  nowIso(){ return new Date().toISOString(); },
  todayIso(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); },
  dmy(iso){
    if(!iso) return "";
    const p = iso.split("-"); if(p.length!==3) return iso;
    return p[2]+"."+p[1]+"."+p[0];
  },
  esc(s){
    s = (s===undefined||s===null) ? "" : String(s);
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  },
  nl2br(s){ return SV.util.esc(s).replace(/\n/g,"<br>"); },
  qs(sel, root){ return (root||document).querySelector(sel); },
  qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); },
  byId(id){ return document.getElementById(id); },
  debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; },
  autoGrow(ta){
    if(!ta) return;
    ta.style.height = "auto";
    ta.style.height = (ta.scrollHeight + 2) + "px";
  },
  installAutoGrow(root){
    SV.util.qsa("textarea", root||document).forEach(ta=>{
      SV.util.autoGrow(ta);
      ta.oninput = ()=>SV.util.autoGrow(ta);
    });
  },
  downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  },
  // Macht einen Nutzertext (z.B. Teamname) dateinamensicher fuer Windows/Mac/Linux -
  // ersetzt reservierte Zeichen, kuerzt auf eine vernuenftige Laenge.
  safeFilenamePart(s){
    const cleaned = String(s||"").trim().replace(/[\\/:*?"<>|]+/g, "-");
    return cleaned.slice(0, 60) || "Team";
  },
  b64FromBytes(bytes){
    let bin = ""; const arr = new Uint8Array(bytes);
    for(let i=0;i<arr.length;i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin);
  },
  bytesFromB64(b64){
    const bin = atob(b64); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  },
};

/* ===================== crypto (Teampasswort) ===================== */
SV.crypto2 = {
  async deriveKey(password, saltBytes){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:saltBytes, iterations:150000, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]
    );
  },
  randomSalt(){ return crypto.getRandomValues(new Uint8Array(16)); },
  async encryptJSON(key, obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const data = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
    return { iv: SV.util.b64FromBytes(iv), data: SV.util.b64FromBytes(data) };
  },
  async decryptJSON(key, blob){
    const iv = SV.util.bytesFromB64(blob.iv);
    const data = SV.util.bytesFromB64(blob.data);
    const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
    return JSON.parse(new TextDecoder().decode(dec));
  },
  // Byte-Varianten (fuer Anhang-Dateien: Bild/PDF-Rohdaten statt JSON).
  async encryptBytes(key, bytes){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, bytes);
    return { iv: SV.util.b64FromBytes(iv), data: SV.util.b64FromBytes(data) };
  },
  async decryptBytes(key, blob){
    const iv = SV.util.bytesFromB64(blob.iv);
    const data = SV.util.bytesFromB64(blob.data);
    const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
    return new Uint8Array(dec);
  },
};

/* ===================== IndexedDB low level ===================== */
SV.idb = {
  _db: null,
  open(){
    if(SV.idb._db) return Promise.resolve(SV.idb._db);
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open("mdb-db", 2);
      req.onupgradeneeded = (ev)=>{
        const db = ev.target.result;
        if(!db.objectStoreNames.contains("teams")){
          db.createObjectStore("teams", {keyPath:"id"});
        }
        if(!db.objectStoreNames.contains("agendas")){
          const s = db.createObjectStore("agendas", {keyPath:"id"});
          s.createIndex("teamId", "teamId", {unique:false});
        }
        if(!db.objectStoreNames.contains("meetings")){
          const s = db.createObjectStore("meetings", {keyPath:"id"});
          s.createIndex("teamId", "teamId", {unique:false});
        }
        if(!db.objectStoreNames.contains("attachments")){
          // Anhang-Rohdaten (Bild/PDF-Bytes) getrennt von den Agenda-/Meeting-
          // Datensaetzen, damit diese nicht durch grosse Dateien aufgebläht
          // werden. scopeId = "agenda-"+TOP-Id bzw. "meeting-"+TOP-Id, so laesst
          // sich beim Loeschen/Duplizieren eines TOPs gezielt darueber iterieren.
          const s = db.createObjectStore("attachments", {keyPath:"id"});
          s.createIndex("scopeId", "scopeId", {unique:false});
        }
      };
      req.onsuccess = ()=>{ SV.idb._db = req.result; resolve(req.result); };
      req.onerror = ()=>reject(req.error);
    });
  },
  async tx(storeNames, mode){
    const db = await SV.idb.open();
    return db.transaction(storeNames, mode);
  },
  put(storeName, obj){
    return SV.idb.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).put(obj);
      tx.oncomplete = ()=>resolve(obj);
      tx.onerror = ()=>reject(tx.error);
    }));
  },
  get(storeName, id){
    return SV.idb.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).get(id);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    }));
  },
  getAll(storeName){
    return SV.idb.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    }));
  },
  getAllByIndex(storeName, indexName, value){
    return SV.idb.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readonly");
      const idx = tx.objectStore(storeName).index(indexName);
      const req = idx.getAll(value);
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    }));
  },
  delete(storeName, id){
    return SV.idb.open().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    }));
  },
};

/* ===================== Speicherschicht SV.store =====================
   Abstraktionsschicht: die gesamte UI/Fachlogik ruft NUR diese Funktionen
   auf, nie IndexedDB direkt. Ein spaeterer Wechsel auf einen gemeinsamen
   Mehrpersonen-Speicher muesste nur dieses Modul ersetzen.
   Siehe Meetingdb/vorgehen.md ("Architekturentscheidungen"). */
SV.store = {
  unlockedKeys: {}, // teamId -> CryptoKey (nur im Arbeitsspeicher)

  async listTeams(){
    const teams = await SV.idb.getAll("teams");
    teams.sort((a,b)=> (a.name||"").localeCompare(b.name||"", "de"));
    return teams;
  },

  async createTeam(name, password){
    const id = SV.util.uuid();
    const team = { id, name: name.trim(), passwordProtected: !!password, createdAt: SV.util.nowIso() };
    if(password){
      const salt = SV.crypto2.randomSalt();
      const key = await SV.crypto2.deriveKey(password, salt);
      const verifier = await SV.crypto2.encryptJSON(key, {check:"ok"});
      team.salt = SV.util.b64FromBytes(salt);
      team.verifier = verifier;
      SV.store.unlockedKeys[id] = key;
    } else {
      SV.store.unlockedKeys[id] = null; // kein Passwort -> sofort "entsperrt"
    }
    await SV.idb.put("teams", team);
    return team;
  },

  async deleteTeam(teamId){
    const agendas = await SV.idb.getAllByIndex("agendas", "teamId", teamId);
    const meetings = await SV.idb.getAllByIndex("meetings", "teamId", teamId);
    for(const a of agendas) await SV.idb.delete("agendas", a.id);
    for(const m of meetings) await SV.idb.delete("meetings", m.id);
    // Verwaiste Anhang-Rohdaten dieses Teams mit aufraeumen (kein eigener
    // teamId-Index auf dem attachments-Store noetig - diese Liste ist klein).
    const allAttachments = await SV.idb.getAll("attachments");
    for(const at of allAttachments){ if(at.teamId === teamId) await SV.idb.delete("attachments", at.id); }
    await SV.idb.delete("teams", teamId);
    delete SV.store.unlockedKeys[teamId];
  },

  isUnlocked(teamId){ return SV.store.unlockedKeys[teamId] !== undefined; },

  // Versucht ein Team ohne Passwort freizuschalten (nur sinnvoll, wenn
  // passwordProtected == false); gibt true zurueck.
  async unlockPlain(teamId){
    SV.store.unlockedKeys[teamId] = null; // markiert "entsperrt, kein Schluessel noetig"
    return true;
  },

  async unlockWithPassword(team, password){
    const salt = SV.util.bytesFromB64(team.salt);
    const key = await SV.crypto2.deriveKey(password, salt);
    try{
      const check = await SV.crypto2.decryptJSON(key, team.verifier);
      if(check && check.check === "ok"){
        SV.store.unlockedKeys[team.id] = key;
        return true;
      }
      return false;
    }catch(e){
      return false; // AES-GCM-Tag passt nicht -> falsches Passwort
    }
  },

  lock(teamId){ delete SV.store.unlockedKeys[teamId]; },

  _keyFor(teamId){
    const k = SV.store.unlockedKeys[teamId];
    return k===undefined ? undefined : k; // undefined = gesperrt, null = kein Passwort
  },

  async _decryptRecord(storeName, rec){
    if(rec.plain !== undefined) return rec.plain;
    const key = SV.store._keyFor(rec.teamId);
    if(key === undefined) throw new Error("TEAM_LOCKED");
    return SV.crypto2.decryptJSON(key, rec.enc);
  },

  async _saveRecord(storeName, teamId, dataObj){
    dataObj.updatedAt = SV.util.nowIso();
    const key = SV.store._keyFor(teamId);
    if(key === undefined) throw new Error("TEAM_LOCKED");
    const rec = { id: dataObj.id, teamId, updatedAt: dataObj.updatedAt };
    if(key){ rec.enc = await SV.crypto2.encryptJSON(key, dataObj); }
    else { rec.plain = dataObj; }
    await SV.idb.put(storeName, rec);
    return dataObj;
  },

  async listAgendas(teamId){
    const recs = await SV.idb.getAllByIndex("agendas", "teamId", teamId);
    const out = [];
    for(const r of recs) out.push(await SV.store._decryptRecord("agendas", r));
    return out;
  },
  async getAgenda(teamId, id){
    const r = await SV.idb.get("agendas", id);
    if(!r || r.teamId !== teamId) return null;
    return SV.store._decryptRecord("agendas", r);
  },
  saveAgenda(teamId, agenda){ return SV.store._saveRecord("agendas", teamId, agenda); },
  deleteAgenda(id){ return SV.idb.delete("agendas", id); },

  async listMeetings(teamId){
    const recs = await SV.idb.getAllByIndex("meetings", "teamId", teamId);
    const out = [];
    for(const r of recs) out.push(await SV.store._decryptRecord("meetings", r));
    return out;
  },
  async getMeeting(teamId, id){
    const r = await SV.idb.get("meetings", id);
    if(!r || r.teamId !== teamId) return null;
    return SV.store._decryptRecord("meetings", r);
  },
  saveMeeting(teamId, meeting){ return SV.store._saveRecord("meetings", teamId, meeting); },
  deleteMeeting(id){ return SV.idb.delete("meetings", id); },

  // ---------- Anhang-Dateien (Rohdaten getrennt vom Agenda-/Meeting-Datensatz) ----------
  // scopeId = "agenda-"+TOP-Id bzw. "meeting-"+TOP-Id. Die Metadaten (Dateiname,
  // Anzeigeart, Bildunterschrift) liegen im anhaenge-Array des TOPs selbst (wie
  // blocks/aufgaben/antraege); hier liegen nur die Bytes, verschluesselt wie
  // der Rest des Teams, falls passwortgeschuetzt.
  async saveAttachmentFile(teamId, scopeId, attachmentId, file){
    const bytes = new Uint8Array(await file.arrayBuffer());
    const key = SV.store._keyFor(teamId);
    if(key === undefined) throw new Error("TEAM_LOCKED");
    const rec = { id: attachmentId, scopeId, teamId, mime: file.type||"", size: bytes.length };
    if(key){ rec.enc = await SV.crypto2.encryptBytes(key, bytes); }
    else { rec.plain = SV.util.b64FromBytes(bytes); }
    await SV.idb.put("attachments", rec);
    return rec;
  },
  async getAttachmentBlob(teamId, attachmentId, mimeHint){
    const rec = await SV.idb.get("attachments", attachmentId);
    if(!rec) return null;
    let bytes;
    if(rec.plain !== undefined){ bytes = SV.util.bytesFromB64(rec.plain); }
    else {
      const key = SV.store._keyFor(teamId);
      if(key === undefined) throw new Error("TEAM_LOCKED");
      bytes = await SV.crypto2.decryptBytes(key, rec.enc);
    }
    return new Blob([bytes], {type: rec.mime || mimeHint || "application/octet-stream"});
  },
  deleteAttachmentFile(attachmentId){ return SV.idb.delete("attachments", attachmentId); },
  // Kopiert die Bytes eines Anhangs unter neuer Id/neuem Scope (z.B. beim
  // Sitzungsstart: Agenda-Anhaenge werden fuer die Sitzung physisch dupliziert,
  // damit die Agenda-Vorlage unveraendert bleibt - wie im Python-Original).
  async duplicateAttachmentFile(oldAttachmentId, newAttachmentId, newScopeId){
    const rec = await SV.idb.get("attachments", oldAttachmentId);
    if(!rec) return null;
    const copy = Object.assign({}, rec, { id:newAttachmentId, scopeId:newScopeId });
    await SV.idb.put("attachments", copy);
    return copy;
  },
  async deleteAttachmentsByScope(scopeId){
    const recs = await SV.idb.getAllByIndex("attachments", "scopeId", scopeId);
    for(const r of recs) await SV.idb.delete("attachments", r.id);
  },

  // Rohdaten fuer Export (bleiben verschluesselt, falls Team geschuetzt)
  async exportAll(){
    const teams = await SV.idb.getAll("teams");
    const agendas = await SV.idb.getAll("agendas");
    const meetings = await SV.idb.getAll("meetings");
    const attachments = await SV.idb.getAll("attachments");
    return { format:"meetingdb-export", version:1, exportedAt: SV.util.nowIso(), teams, agendas, meetings, attachments };
  },

  // Export nur eines einzelnen Teams (fuer die Export-Art "je Team eine Datei") -
  // gleiches Format wie exportAll, nur auf dieses Team eingeschraenkt. Anhaenge
  // haben keinen eigenen teamId-Index (siehe deleteTeam oben) - ueber alle filtern.
  async exportTeam(teamId){
    const team = await SV.idb.get("teams", teamId);
    if(!team) return null;
    const agendas = await SV.idb.getAllByIndex("agendas", "teamId", teamId);
    const meetings = await SV.idb.getAllByIndex("meetings", "teamId", teamId);
    const allAttachments = await SV.idb.getAll("attachments");
    const attachments = allAttachments.filter(at=>at.teamId===teamId);
    return { format:"meetingdb-export", version:1, exportedAt: SV.util.nowIso(), teams:[team], agendas, meetings, attachments };
  },

  async importAll(dump){
    if(!dump || (dump.format !== "meetingdb-export" && dump.format !== "sitzungsverwaltung-export")) throw new Error(SV.i18n.t("err_unknown_format"));
    const existingTeams = await SV.idb.getAll("teams");
    const existingAgendas = await SV.idb.getAll("agendas");
    const existingMeetings = await SV.idb.getAll("meetings");
    const existingAttachments = await SV.idb.getAll("attachments");
    const byId = (arr)=>{ const m={}; arr.forEach(x=>m[x.id]=x); return m; };
    const teamMap = byId(existingTeams), agendaMap = byId(existingAgendas), meetingMap = byId(existingMeetings);
    const attachmentMap = byId(existingAttachments);
    let added=0, updated=0, skipped=0;
    for(const t of (dump.teams||[])){
      if(!teamMap[t.id]){ await SV.idb.put("teams", t); added++; }
      else skipped++; // bestehendes Team nicht ueberschreiben (Passwort/Salt bleibt unberuehrt)
    }
    for(const a of (dump.agendas||[])){
      const ex = agendaMap[a.id];
      if(!ex){ await SV.idb.put("agendas", a); added++; }
      else if(!ex.updatedAt || (a.updatedAt && a.updatedAt > ex.updatedAt)){ await SV.idb.put("agendas", a); updated++; }
      else skipped++;
    }
    for(const m of (dump.meetings||[])){
      const ex = meetingMap[m.id];
      if(!ex){ await SV.idb.put("meetings", m); added++; }
      else if(!ex.updatedAt || (m.updatedAt && m.updatedAt > ex.updatedAt)){ await SV.idb.put("meetings", m); updated++; }
      else skipped++;
    }
    // Anhang-Dateien haben kein eigenes updatedAt (Bytes aendern sich nach dem
    // Anlegen nicht) - unbekannte Id einfach uebernehmen, bekannte Id ueberspringen.
    for(const at of (dump.attachments||[])){
      if(!attachmentMap[at.id]){ await SV.idb.put("attachments", at); added++; }
      else skipped++;
    }
    return {added, updated, skipped};
  },
};

/* ===================== Textformatierung (Port von core/textformat.py) =====================
   Erkennt "-"/"1., 2., ..."-Aufzaehlungen in Textbloecken. Tiefe wird RELATIV
   zur jeweils letzten gesehenen Listenzeile berechnet (Stack), nicht anhand
   einer festen Leerzeichenzahl - siehe Runde 10/11/13-Nachtraege im
   Python-Original. Eine mit ":" endende Ueberschriftzeile, der direkt
   (ohne Leerzeile) eine nicht eingerueckte Liste folgt, stuft diese
   automatisch eine Ebene tiefer ein. */
SV.textformat = {
  LIST_RE: /^(\s*)(?:-\s+(.*)|(\d+)[.)]\s+(.*))$/,

  cleanBlockContent(raw){
    raw = raw || "";
    let lines = raw.split("\n");
    while(lines.length && lines[0].trim()==="") lines.shift();
    while(lines.length && lines[lines.length-1].trim()==="") lines.pop();
    return lines.join("\n");
  },

  indentLen(ws){
    let n = 0;
    for(const ch of ws) n += (ch === "\t" ? 2 : 1);
    return n;
  },

  parseBlockSegments(content){
    const rawLines = (content||"").split("\n");
    const segments = [];
    let textBuf = [];
    let stack = [];
    let colonOffset = 0;
    let inListRun = false;
    let prevLineType = null; // 'blank' | 'text' | 'list'
    let prevTextEndsColon = false;
    let lastListDepth = null;
    let curListSeg = null;

    const flushText = ()=>{
      if(textBuf.length){
        segments.push({type:"text", text: textBuf.join("\n")});
      }
      textBuf = [];
    };

    for(const line of rawLines){
      if(line.trim()===""){
        stack = []; colonOffset = 0; inListRun = false; curListSeg = null; lastListDepth = null;
        textBuf.push(line);
        prevLineType = "blank";
        continue;
      }
      const m = line.match(SV.textformat.LIST_RE);
      if(m){
        const leadWs = m[1] || "";
        const itemText = (m[2] !== undefined ? m[2] : m[4]) || "";
        if(!inListRun){
          colonOffset = (prevLineType === "text" && prevTextEndsColon) ? 1 : 0;
          stack = [];
          inListRun = true;
          lastListDepth = null;
          flushText();
        }
        const indentLen = SV.textformat.indentLen(leadWs);
        while(stack.length && stack[stack.length-1].indent > indentLen) stack.pop();
        let depth;
        if(stack.length && stack[stack.length-1].indent === indentLen){
          depth = stack[stack.length-1].depth;
        } else {
          depth = stack.length ? stack[stack.length-1].depth + 1 : 0;
          stack.push({indent: indentLen, depth});
        }
        const finalDepth = depth + colonOffset;
        if(curListSeg && lastListDepth === finalDepth){
          curListSeg.items.push(itemText);
        } else {
          curListSeg = {type:"list", depth: finalDepth, items:[itemText]};
          segments.push(curListSeg);
        }
        lastListDepth = finalDepth;
        prevLineType = "list";
      } else {
        if(inListRun){ stack=[]; colonOffset=0; inListRun=false; curListSeg=null; lastListDepth=null; }
        textBuf.push(line);
        prevLineType = "text";
        prevTextEndsColon = line.trim().endsWith(":");
      }
    }
    flushText();
    return segments;
  },

  // HTML-Rendering fuer die Protokoll-Ansicht (entspricht meeting_view.html / _macros.html::segments)
  renderSegmentsHtml(content){
    const segs = SV.textformat.parseBlockSegments(content);
    let html = "";
    for(const seg of segs){
      if(seg.type === "text"){
        const t = seg.text.replace(/^\n+|\n+$/g, "");
        if(t.trim()==="") continue;
        html += `<p style="margin:4px 0; white-space:pre-wrap;">${SV.util.esc(t)}</p>`;
      } else {
        if(seg.depth === 0){
          html += `<ul class="block-bullets">`;
          for(const it of seg.items) html += `<li>${SV.util.esc(it)}</li>`;
          html += `</ul>`;
        } else {
          const margin = 40 + (seg.depth-1)*20;
          html += `<ul class="block-sublist" style="margin-left:${margin}px;">`;
          for(const it of seg.items) html += `<li>– ${SV.util.esc(it)}</li>`;
          html += `</ul>`;
        }
      }
    }
    return html || "";
  },
};

/* ===================== Datenmodell (Port von core/models.py) ===================== */
SV.model = {
  // Unterstuetzte Dateitypen fuer Anhaenge, erkannt an der Dateiendung (nicht
  // am gemeldeten MIME-Typ - wie im Python-Original, da Browser/Geraete beim
  // Teilen/Hochladen uneinheitliche MIME-Typen liefern). "bild" wird in der
  // PDF-Ausgabe eingebettet, "pdf" wird als echte Zusatzseiten angehaengt.
  ATTACHMENT_EXTENSIONS: {
    jpg:"bild", jpeg:"bild", png:"bild", gif:"bild", webp:"bild", heic:"bild", heif:"bild",
    pdf:"pdf",
  },
  attachmentKind(filename){
    const m = /\.([a-z0-9]+)$/i.exec((filename||"").trim());
    const ext = m ? m[1].toLowerCase() : "";
    return SV.model.ATTACHMENT_EXTENSIONS[ext] || null; // null = nicht unterstuetzter Typ
  },
  newAttachment(filename, display, caption){
    return {
      id: SV.util.uuid(), filename: filename||"", kind: SV.model.attachmentKind(filename),
      display: display==="verborgen" ? "verborgen" : "anhang", // "anhang" = im Anhang sichtbar, "verborgen" = nicht im Protokoll
      caption: caption||"", showFilename: false, created_at: SV.util.nowIso(),
    };
  },
  newBlock(content, kind){
    const b = { id: SV.util.uuid(), type:"text", content: SV.textformat.cleanBlockContent(content), created_at: SV.util.nowIso() };
    if(kind) b.kind = kind; // "prep" = Vorbereitung (nicht im Protokoll), "protokoll" = Meeting Protokoll
    return b;
  },
  newTask(text, verantwortlich, termin){
    return { id: SV.util.uuid(), text: SV.textformat.cleanBlockContent(text||""), verantwortlich: verantwortlich||"",
      termin: termin||"", status:"neu", kommentare: [], created_at: SV.util.nowIso() };
  },
  newComment(text){
    return { id: SV.util.uuid(), text: text||"", created_at: SV.util.nowIso() };
  },
  newAntrag(data){
    return {
      id: SV.util.uuid(),
      antrag_text: SV.textformat.cleanBlockContent(data.antrag_text||""),
      beschluss_text: SV.textformat.cleanBlockContent(data.beschluss_text||""),
      ergebnis: data.ergebnis||"offen",
      dafuer: data.dafuer||0, dagegen: data.dagegen||0, enthaltung: data.enthaltung||0,
      prepared: data.prepared||false, // true = in der Agenda-Vorbereitung angelegt (noch nicht im Meeting behandelt)
      created_at: SV.util.nowIso(),
    };
  },
  newAgendaItem(title, opts){
    opts = opts || {};
    return {
      id: SV.util.uuid(), title: title||"", parent_id: opts.parent_id||null, order: opts.order||0,
      public: opts.public !== undefined ? opts.public : true,
      blocks: [SV.model.newBlock("", "prep")], geloeschte_blocks: [], aufgaben: [], geloeschte_aufgaben: [],
      antraege: [], geloeschte_antraege: [],
      anhaenge: [], geloeschte_anhaenge: [],
    };
  },
  newAgenda(title, date){
    return { id: SV.util.uuid(), title: title||"", date: date||"", items: [], geloeschte_items: [], created_at: SV.util.nowIso() };
  },
  newMeetingItem(title, opts){
    opts = opts || {};
    return {
      id: SV.util.uuid(), title: title||"", parent_id: opts.parent_id||null, order: opts.order||0,
      public: opts.public !== undefined ? opts.public : true, status:"normal",
      done: false, timerElapsedMs: 0, timerRunningSince: null,
      blocks: [SV.model.newBlock("", "protokoll")], geloeschte_blocks: [], antraege: [], geloeschte_antraege: [],
      aufgaben: [], geloeschte_aufgaben: [],
      anhaenge: [], geloeschte_anhaenge: [],
    };
  },
  newMeeting(date, title, agenda_id){
    return {
      id: SV.util.uuid(), date: date||"", title: title||"", agenda_id: agenda_id||null,
      status:"laufend", items: [], geloeschte_items: [], intro_note:"",
      showTimerInProtocol: false,
      created_at: SV.util.nowIso(), completed_at: null,
    };
  },
  async meetingItemFromAgendaItem(ai, idMap){
    const mi = SV.model.newMeetingItem(ai.title, {parent_id: ai.parent_id, order: ai.order, public: ai.public});
    idMap[ai.id] = mi.id;
    // Reihenfolge: zuerst die aus der Agenda uebernommenen Bloecke (inkl. des
    // Vorbereitungs-Blocks), danach der von newMeetingItem automatisch
    // angelegte "Meeting Protokoll"-Block.
    const protokollBlocks = mi.blocks;
    mi.blocks = (ai.blocks||[]).map(b=> Object.assign({}, b, {id: SV.util.uuid()}));
    mi.blocks.push(...protokollBlocks);
    (ai.aufgaben||[]).forEach(t=> mi.aufgaben.push(Object.assign({}, t, {id: SV.util.uuid()})));
    // Vorbereitete Antraege aus der Agenda werden als "prepared" uebernommen -
    // sie erscheinen im Meeting als vorbereitete Beschluesse und koennen dort
    // noch geloescht werden, falls sie gar nicht behandelt werden.
    (ai.antraege||[]).forEach(a=> mi.antraege.push(Object.assign({}, a, {id: SV.util.uuid(), prepared:true})));
    // Anhaenge physisch duplizieren (neue Id, neuer Scope "meeting-"+mi.id) -
    // die Agenda bleibt als wiederverwendbare Vorlage unveraendert, genau wie
    // im Python-Original ("Agenda bleibt unveraendert").
    for(const at of (ai.anhaenge||[])){
      const newId = SV.util.uuid();
      await SV.store.duplicateAttachmentFile(at.id, newId, "meeting-"+mi.id);
      mi.anhaenge.push(Object.assign({}, at, {id:newId}));
    }
    return mi;
  },
  // Baut Meeting-Items aus Agenda-Items (zweistufig: erst Haupt-TOPs, dann
  // Unterpunkte mit remapptem parent_id - analog zum Python-Original).
  async buildMeetingItemsFromAgenda(agendaItems){
    const idMap = {};
    const mains = agendaItems.filter(it=>!it.parent_id);
    const subs = agendaItems.filter(it=>it.parent_id);
    const out = [];
    for(const it of mains) out.push(await SV.model.meetingItemFromAgendaItem(it, idMap));
    for(const it of subs){
      const mi = await SV.model.meetingItemFromAgendaItem(it, idMap);
      mi.parent_id = idMap[it.parent_id] || null;
      out.push(mi);
    }
    return out;
  },
  // Backfill fuer bereits bestehende Agenda-TOPs (vor Version 1.7.0 angelegt),
  // die noch keinen Vorbereitungs-Block haben: der bisherige erste Textblock
  // wird zum neuen Vorbereitungs-Block (kein zusaetzlicher leerer Block, kein
  // Inhaltsverlust); nur wenn gar kein Block existiert, wird ein leerer
  // Vorbereitungs-Block angelegt. Gibt true zurueck, wenn das Item geaendert wurde.
  ensurePrepBlock(item){
    let changed = false;
    // Aeltere Agenda-Items (vor Version 1.7.0 angelegt/importiert) haben noch
    // gar kein antraege-Array - ohne dieses Nachruesten wuerde die neue
    // Antrags-Vorbereitung (renderAntraegeSection/addAntrag) daran scheitern.
    if(!item.antraege){ item.antraege = []; changed = true; }
    if(!item.geloeschte_antraege){ item.geloeschte_antraege = []; changed = true; }
    item.blocks = item.blocks || [];
    if(!item.blocks.some(b=>b.kind==="prep")){
      if(item.blocks.length){
        item.blocks[0].kind = "prep";
      } else {
        item.blocks.unshift(SV.model.newBlock("", "prep"));
      }
      changed = true;
    }
    return changed;
  },
  // Backfill fuer bereits bestehende (noch nicht abgeschlossene) Meeting-Items,
  // die noch keinen Meeting-Protokoll-Block haben: hier wird IMMER ein neuer,
  // leerer Block angehaengt - ein bestehender Block darf nie umetikettiert
  // werden, sonst wuerden bereits erfasste Protokoll-Inhalte rueckwirkend aus
  // dem Protokoll-Export verschwinden. Gibt true zurueck, wenn geaendert wurde.
  ensureProtokollBlock(item){
    item.blocks = item.blocks || [];
    if(item.blocks.some(b=>b.kind==="protokoll")) return false;
    item.blocks.push(SV.model.newBlock("", "protokoll"));
    return true;
  },
  // Nummerierung ("1", "2.1", ...) inkl. Sicherheitsnetz fuer Unterpunkte
  // mit nicht mehr existierender parent_id.
  numberedItems(items){
    const byId = {}; items.forEach(it=>byId[it.id]=it);
    const mains = items.filter(it=> !it.parent_id || !byId[it.parent_id])
      .sort((a,b)=>a.order-b.order);
    const out = [];
    mains.forEach((m,i)=>{
      out.push({item:m, number: String(i+1), depth:0});
      const subs = items.filter(it=>it.parent_id===m.id).sort((a,b)=>a.order-b.order);
      subs.forEach((s,j)=> out.push({item:s, number:`${i+1}.${j+1}`, depth:1}));
    });
    return out;
  },
  renumberSiblings(items, parentId){
    items.filter(it=>it.parent_id===parentId).sort((a,b)=>a.order-b.order)
      .forEach((it,i)=> it.order = i);
  },
  newItemFor(kind, title, opts){
    return kind==="meeting" ? SV.model.newMeetingItem(title, opts) : SV.model.newAgendaItem(title, opts);
  },
  // Hoch/Runter- und Ein-/Ausstufen eines TOPs (Port von _indent_item in app.py).
  indentItem(items, itemId, direction){
    const it = items.find(x=>x.id===itemId);
    if(!it) return {ok:false};
    if(direction === "in"){
      if(it.parent_id) return {ok:false};
      const topSiblings = items.filter(x=>!x.parent_id).sort((a,b)=>a.order-b.order);
      const idx = topSiblings.findIndex(x=>x.id===itemId);
      if(idx<=0) return {ok:false};
      const hasChildren = items.some(x=>x.parent_id===it.id);
      if(hasChildren) return {ok:false, error:SV.t("err_item_has_children")};
      const newParent = topSiblings[idx-1];
      it.parent_id = newParent.id;
      it.order = 9999;
      SV.model.renumberSiblings(items, newParent.id);
      return {ok:true};
    }
    if(direction === "out"){
      if(!it.parent_id) return {ok:false};
      const parentId = it.parent_id;
      const parent = items.find(x=>x.id===parentId);
      it.parent_id = null;
      it.order = (parent ? parent.order : 0) + 0.5;
      SV.model.renumberSiblings(items, parentId);
      SV.model.renumberSiblings(items, null);
      return {ok:true};
    }
    return {ok:false};
  },
  moveItem(items, itemId, direction){
    const it = items.find(x=>x.id===itemId);
    if(!it) return {ok:false};
    const sibs = items.filter(x=>x.parent_id===it.parent_id).sort((a,b)=>a.order-b.order);
    const idx = sibs.findIndex(x=>x.id===itemId);
    const swapIdx = direction==="up" ? idx-1 : idx+1;
    if(swapIdx<0 || swapIdx>=sibs.length) return {ok:false};
    const other = sibs[swapIdx];
    const tmp = it.order; it.order = other.order; other.order = tmp;
    return {ok:true};
  },
};

/* ===================== Generische Mutations-Helfer (Agenda & Meeting) ===================== */
SV.data = {
  load(kind, teamId, id){ return kind==="agenda" ? SV.store.getAgenda(teamId,id) : SV.store.getMeeting(teamId,id); },
  save(kind, teamId, obj){ return kind==="agenda" ? SV.store.saveAgenda(teamId,obj) : SV.store.saveMeeting(teamId,obj); },
};
SV.actions._mutate = async function(kind, containerId, fn){
  const teamId = SV.state.currentTeamId;
  const obj = await SV.data.load(kind, teamId, containerId);
  if(!obj) return {error:"nicht gefunden"};
  const result = fn(obj) || {};
  await SV.data.save(kind, teamId, obj);
  return result;
};
SV.actions._refresh = function(){ SV.router.go(); };

SV.actions.addItem = async function(kind, containerId, titleElId, publicElId){
  const title = SV.util.byId(titleElId).value.trim();
  if(!title){ SV.ui.toast(SV.t("toast_title_required")); return; }
  const isPublic = publicElId ? SV.util.byId(publicElId).checked : true;
  await SV.actions._mutate(kind, containerId, (c)=>{
    const topOrders = c.items.filter(x=>!x.parent_id).map(x=>x.order);
    const order = topOrders.length ? Math.max(...topOrders)+1 : 0;
    c.items.push(SV.model.newItemFor(kind, title, {order, public:isPublic}));
  });
  SV.actions._refresh();
};
SV.actions.editItemTitle = async function(kind, containerId, itemId, inputId){
  const title = SV.util.byId(inputId).value.trim();
  if(!title){ SV.ui.toast(SV.t("toast_title_required")); return; }
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId); if(it) it.title = title;
  });
  SV.actions._refresh();
};
SV.actions.indentItem = async function(kind, containerId, itemId, direction){
  const res = await SV.actions._mutate(kind, containerId, (c)=> SV.model.indentItem(c.items, itemId, direction));
  if(res && res.error) SV.ui.toast(res.error);
  SV.actions._refresh();
};
SV.actions.moveItem = async function(kind, containerId, itemId, direction){
  await SV.actions._mutate(kind, containerId, (c)=> SV.model.moveItem(c.items, itemId, direction));
  SV.actions._refresh();
};
SV.actions.toggleItemPublic = async function(kind, containerId, itemId){
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId); if(it) it.public = !it.public;
  });
  SV.actions._refresh();
};
SV.actions.setItemStatus = async function(containerId, itemId, status){
  // Wird ein verschobener TOP auf "normal" zurueckgesetzt, muss die beim
  // Verschieben angelegte Kopie in der Ziel-Agenda geloescht werden (inkl.
  // ihrer Anhang-Rohdaten) - sonst gibt es den Punkt doppelt (siehe
  // SV.actions.moveItemToAgenda).
  if(status === "normal"){
    const teamId = SV.state.currentTeamId;
    const meeting = await SV.store.getMeeting(teamId, containerId);
    const it = meeting && (meeting.items||[]).find(x=>x.id===itemId);
    if(it && it.verschobenZuAgendaId && it.verschobenZuItemId){
      const targetAgenda = await SV.store.getAgenda(teamId, it.verschobenZuAgendaId);
      if(targetAgenda){
        const stillThere = (targetAgenda.items||[]).some(x=>x.id===it.verschobenZuItemId);
        if(stillThere){
          targetAgenda.items = (targetAgenda.items||[]).filter(x=> x.id!==it.verschobenZuItemId && x.parent_id!==it.verschobenZuItemId);
          await SV.store.saveAgenda(teamId, targetAgenda);
        }
        await SV.store.deleteAttachmentsByScope("agenda-"+it.verschobenZuItemId);
      }
    }
  }
  await SV.actions._mutate("meeting", containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    if(it){
      it.status = status;
      if(status === "normal"){ delete it.verschobenZuAgendaId; delete it.verschobenZuItemId; }
    }
  });
  SV.actions._refresh();
};
SV.actions.moveItemToAgenda = async function(meetingId, itemId, targetSelectId, newTitleElId){
  const teamId = SV.state.currentTeamId;
  const targetAgendaId = SV.util.byId(targetSelectId).value;
  const newTitle = newTitleElId ? SV.util.byId(newTitleElId).value.trim() : "";
  if(!targetAgendaId){ SV.ui.toast(SV.t("toast_select_target_agenda")); return; }
  if(targetAgendaId === "__new__" && !newTitle){ SV.ui.toast(SV.t("toast_select_target_agenda")); return; }

  const meeting = await SV.store.getMeeting(teamId, meetingId);
  if(!meeting) return;
  const item = (meeting.items||[]).find(x=>x.id===itemId);
  if(!item) return;

  let targetAgenda;
  if(targetAgendaId === "__new__"){
    targetAgenda = SV.model.newAgenda(newTitle, "");
  } else {
    targetAgenda = await SV.store.getAgenda(teamId, targetAgendaId);
    if(!targetAgenda){ SV.ui.toast(SV.t("toast_select_target_agenda")); return; }
  }

  // Inhalt wird in die Ziel-Agenda kopiert (siehe AskUserQuestion-Antwort):
  // Titel + Vorbereitungs-Block-Inhalt + Anhaenge + nur die bereits
  // vorbereiteten ("prepared") Antraege - waehrend des Meetings frisch
  // hinzugefuegte Antraege bleiben im Meeting zurueck.
  const topOrders = (targetAgenda.items||[]).filter(x=>!x.parent_id).map(x=>x.order);
  const order = topOrders.length ? Math.max(...topOrders)+1 : 0;
  const newItem = SV.model.newAgendaItem(item.title, {order, public:item.public});
  const prepBlock = (item.blocks||[]).find(b=>b.kind==="prep");
  newItem.blocks = [SV.model.newBlock(prepBlock ? prepBlock.content : "", "prep")];
  newItem.antraege = (item.antraege||[]).filter(a=>a.prepared).map(a=> SV.model.newAntrag(Object.assign({}, a, {prepared:true})));
  for(const at of (item.anhaenge||[])){
    const newId = SV.util.uuid();
    await SV.store.duplicateAttachmentFile(at.id, newId, "agenda-"+newItem.id);
    newItem.anhaenge.push(Object.assign({}, at, {id:newId}));
  }
  targetAgenda.items = targetAgenda.items || [];
  targetAgenda.items.push(newItem);
  await SV.store.saveAgenda(teamId, targetAgenda);

  await SV.actions._mutate("meeting", meetingId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    if(it){
      it.status = "verschoben";
      it.verschobenZuAgendaId = targetAgenda.id;
      it.verschobenZuItemId = newItem.id;
    }
  });
  SV.actions._refresh();
};
SV.actions.deleteItem = async function(kind, containerId, itemId){
  if(!await SV.ui.confirm(SV.t("confirm_delete_item"))) return;
  await SV.actions._mutate(kind, containerId, (c)=>{
    const toDelete = c.items.filter(x=>x.id===itemId || x.parent_id===itemId);
    toDelete.forEach(it=>{
      it.deleted_at = SV.util.nowIso();
      c.geloeschte_items.push(it);
    });
    c.items = c.items.filter(x=> !toDelete.includes(x));
  });
  SV.actions._refresh();
};
SV.actions.restoreItem = async function(kind, containerId, itemId){
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = (c.geloeschte_items||[]).find(x=>x.id===itemId);

  // Textblocks oder manuellem Stoppen der Uhr) den Auto-Start der Uhr wiederholt
  // auslöst. Wird beim Zurueckspringen (SV.actions.leaveMeetingItem) zurückgesetzt.
  _autoStartDoneForItem: null,
};

/* ===================== TOP-Timer (laufende Stoppuhr pro Tagesordnungspunkt) =====================
   "bearbeitet" (done) und der Timer sind bewusst unabhaengig voneinander (Nutzerentscheidung).
   Pro Sitzung laeuft hoechstens ein Timer gleichzeitig: Starten eines TOP-Timers stoppt
   automatisch einen zuvor laufenden anderen TOP-Timer derselben Sitzung. Der Startzeitpunkt
   wird als ISO-Zeit gespeichert, damit der Timer nach einem Reload korrekt weiterlaeuft
   (die angezeigte Zahl wird live aus "jetzt minus Startzeitpunkt" berechnet, nicht aus einem
   ablaufenden Countdown). */
SV.timer = {
  tickHandle: null,
  liveElapsedMs(item){
    let ms = item.timerElapsedMs || 0;
    if(item.timerRunningSince) ms += Date.now() - new Date(item.timerRunningSince).getTime();
    return Math.max(0, ms);
  },
  fmt(ms){
    const totalSec = Math.max(0, Math.round(ms/1000));
    const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
    const mm = String(m).padStart(2,"0"), ss = String(s).padStart(2,"0");
    return h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  },
  clearTick(){
    if(SV.timer.tickHandle){ clearInterval(SV.timer.tickHandle); SV.timer.tickHandle = null; }
  },
  // Sucht in der Sitzung den (hoechstens einen) laufenden TOP-Timer und aktualisiert die
  // Anzeige im sticky Balken jede Sekunde per gezieltem DOM-Update (kein Re-Render - sonst
  // wuerden offene Textfelder waehrend der Sitzung staendig unterbrochen).
  startTickForMeeting(meeting){
    SV.timer.clearTick();
    const runningItem = (meeting.items||[]).find(it=>it.timerRunningSince);
    if(!runningItem) return;
    const el = SV.util.byId("runningTimerDisplay");
    if(!el) return;
    const update = ()=>{ el.textContent = SV.timer.fmt(SV.timer.liveElapsedMs(runningItem)); };
    update();
    SV.timer.tickHandle = setInterval(update, 1000);
  },
};

/* ===================== App-Einstellungen (geraetelokal) =====================
   Export-Art fuer die Datensicherung (siehe SV.actions.exportAll weiter unten),
   sowie seit Version 1.7.0, ob die Uhr beim Oeffnen eines TOPs (TOP-Detail-
   ansicht) automatisch starten soll. Alles liegt wie die Sprachauswahl
   (SV.i18n) in localStorage, pro Geraet. Es gibt bewusst KEINE Einstellung
   mehr fuer die Listen-/Detaildarstellung selbst (Version 1.8.0) - TOP-Liste
   und TOP-Detailansicht existieren immer gleichzeitig (siehe Phase 8). */
SV.settings = {
  EXPORT_MODE_KEY: "mdb-export-mode",
  exportMode: "perTeam",
  AUTO_TIMER_KEY: "mdb-auto-timer",
  autoStartTimer: true,
  init(){
    try{
      const saved = localStorage.getItem(SV.settings.EXPORT_MODE_KEY);
      if(saved==="single" || saved==="perTeam" || saved==="currentTeam") SV.settings.exportMode = saved;
      const savedAuto = localStorage.getItem(SV.settings.AUTO_TIMER_KEY);
      if(savedAuto!==null) SV.settings.autoStartTimer = savedAuto!=="0";
    }catch(e){}
  },
  setExportMode(mode){
    SV.settings.exportMode = (mode==="single" || mode==="currentTeam") ? mode : "perTeam";
    try{ localStorage.setItem(SV.settings.EXPORT_MODE_KEY, SV.settings.exportMode); }catch(e){}
  },
  setAutoStartTimer(on){
    SV.settings.autoStartTimer = !!on;
    try{ localStorage.setItem(SV.settings.AUTO_TIMER_KEY, SV.settings.autoStartTimer ? "1" : "0"); }catch(e){}
  },
};

SV.ui = {
  toastEl: null,
  toast(msg){
    let el = SV.ui.toastEl;
    if(!el){
      el = document.createElement("div");
      el.style.cssText = "position:fixed; left:50%; bottom:calc(16px + var(--safe-b)); transform:translateX(-50%); background:#1d2630; color:#fff; padding:10px 16px; border-radius:8px; font-size:.88rem; z-index:999; max-width:88vw; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.3);";
      document.body.appendChild(el);
      SV.ui.toastEl = el;
    }
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(SV.ui._toastTimer);
    SV.ui._toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 3200);
  },
  async confirm(msg){ return window.confirm(msg); },
  async prompt(msg, def){ return window.prompt(msg, def||""); },
  renderTabs(){
    const tabs = [
      {hash:"#/agendas", labelKey:"nav_agendas"},
      {hash:"#/meetings", labelKey:"nav_meetings"},
      {hash:"#/beschluesse", labelKey:"nav_beschluesse"},
      {hash:"#/aufgaben", labelKey:"nav_aufgaben"},
      {hash:"#/daten", labelKey:"nav_daten"},
    ];
    const nav = SV.util.byId("tabs");
    const cur = location.hash.split("?")[0] || "#/agendas";
    const hasTeam = !!SV.state.currentTeamId;
    nav.innerHTML = tabs.map(t=>
      `<button ${(!hasTeam && t.hash!=="#/daten")?"disabled":""} class="${cur===t.hash?"active":""}" onclick="location.hash='${t.hash}'">${SV.t(t.labelKey)}</button>`
    ).join("") + `<button class="${cur==="#/teams"?"active":""}" onclick="location.hash='#/teams'">${SV.t("nav_teams")}</button>`;
    const pill = SV.util.byId("teamPill");
    pill.textContent = SV.state.currentTeam ? ("👥 " + SV.state.currentTeam.name) : SV.t("team_pill_none");
    pill.title = SV.t("team_pill_title");
    SV.ui.syncSplitTopOffset();
  },
  // Version 1.9.0: ermittelt die tatsaechliche, geraete-/zoomunabhaengige
  // Gesamthoehe von #topbar + nav#tabs und legt sie als CSS-Variable ab, damit
  // die zweigeteilte Sitzungsansicht (.split-left/.split-right) genau darunter
  // zu scrollen beginnt. offsetHeight statt getBoundingClientRect(), weil
  // Letzteres bei bereits gescrolltem sticky-Zustand verfaelscht waere.
  syncSplitTopOffset(){
    const topbarEl = SV.util.byId("topbar");
    const tabsEl = SV.util.byId("tabs");
    const h = (topbarEl?topbarEl.offsetHeight:0) + (tabsEl?tabsEl.offsetHeight:0);
    if(h>0) document.documentElement.style.setProperty("--split-top", (h+10)+"px");
  },
};

SV.router = {
  routes: {},
  on(pattern, handler){ SV.router.routes[pattern] = handler; },
  async go(){
    SV.timer.clearTick();
    const hash = (location.hash || "#/teams").replace(/^#/, "");
    const [path, qs] = hash.split("?");
    const query = {};
    if(qs) qs.split("&").forEach(p=>{ const [k,v]=p.split("="); if(k) query[decodeURIComponent(k)] = decodeURIComponent(v||""); });
    const parts = path.split("/").filter(Boolean);
    if(!SV.state.teams.length && SV.state.currentTeamId){
      try{ SV.state.teams = await SV.store.listTeams(); }catch(e){}
    }
    SV.ui.renderTabs();
    const app = SV.util.byId("app");
    // Version 1.9.0: die Zweiteilung in SV.views.meetingRun braucht etwas mehr
    // Breite als #app sonst zulaesst - die Route setzt das selbst, hier wird
    // bei jeder Navigation erst einmal auf die normale Breite zurueckgesetzt.
    app.style.maxWidth = "";
    try{
      if(parts[0] === "teams" || parts.length===0){
        await SV.views.teams(app, query);
      } else if(parts[0]==="daten"){
        await SV.views.daten(app, query);
      } else if(!SV.state.currentTeamId){
        location.hash = "#/teams";
      } else if(parts[0]==="agendas" && parts.length===1){
        await SV.views.agendaList(app, query);
      } else if(parts[0]==="agendas" && parts[1]){
        await SV.views.agendaEdit(app, parts[1]);
      } else if(parts[0]==="meetings" && parts.length===1){
        await SV.views.meetingList(app, query);
      } else if(parts[0]==="meetings" && parts[1] && parts[2]==="items" && parts[3]){
        await SV.views.meetingRun(app, parts[1], parts[3]);
      } else if(parts[0]==="meetings" && parts[1]){
        await SV.views.meetingRun(app, parts[1]);
      } else if(parts[0]==="beschluesse"){
        await SV.views.beschlussListView(app, query);
      } else if(parts[0]==="aufgaben"){
        await SV.views.aufgabenListView(app, query);
      } else if(parts[0]==="import" && parts[1]==="review"){
        await SV.views.importReview(app);
      } else if(parts[0]==="import"){
        await SV.views.importStart(app);
      } else {
        app.innerHTML = `<div class="card">${SV.t("err_page_not_found")}</div>`;
      }
      if(SV.state.scrollTarget){
        const el = document.getElementById(SV.state.scrollTarget);
        if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth", block:"start"}), 50);
        SV.state.scrollTarget = null;
      }
    }catch(e){
      if(e && e.message === "TEAM_LOCKED"){
        app.innerHTML = `<div class="card"><h2>${SV.t("team_locked_title")}</h2><p>${SV.t("team_locked_body")}</p><button onclick="location.hash='#/teams'">${SV.t("to_teams")}</button></div>`;
        return;
      }
      console.error(e);
      app.innerHTML = `<div class="card"><h2>${SV.t("generic_error_title")}</h2><p class="muted small">${SV.util.esc(e.message||String(e))}</p></div>`;
    }
  },
};
window.addEventListener("hashchange", SV.router.go);

/* ===================== Views ===================== */
SV.views.teams = async function(app){
  SV.state.teams = await SV.store.listTeams();
  const rows = SV.state.teams.map(t=>{
    const unlocked = SV.store.isUnlocked(t.id);
    const locked = t.passwordProtected && !unlocked;
    return `<div class="list-item">
      <strong>${SV.util.esc(t.name)}</strong>
      ${t.passwordProtected ? `<span class="lock-icon">🔒</span>` : ``}
      ${SV.state.currentTeamId===t.id ? `<span class="tag done">${SV.t("tag_active")}</span>` : ``}
      ${locked ? `
        <div class="row" style="margin-top:8px;">
          <div><label>${SV.t("label_password")}</label><input type="password" id="pw-${t.id}" onkeydown="if(event.key==='Enter')SV.actions.unlockTeam('${t.id}')"></div>
          <div style="flex:0;"><button onclick="SV.actions.unlockTeam('${t.id}')">${SV.t("btn_unlock")}</button></div>
        </div>` : `
        <div class="actions">
          <button onclick="SV.actions.selectTeam('${t.id}')">${SV.t("btn_select")}</button>
          <button class="danger" onclick="SV.actions.deleteTeam('${t.id}')">${SV.t("btn_delete")}</button>
        </div>`}
    </div>`;
  }).join("") || `<p class="muted">${SV.t("teams_none")}</p>`;

  app.innerHTML = `
    <h1>${SV.t("teams_h1")}</h1>
    <p class="muted small">${SV.t("teams_intro")}</p>
    <div class="card">
      <h2>${SV.t("teams_new_h2")}</h2>
      <form class="row" onsubmit="SV.actions.createTeam(event)">
        <div><label>${SV.t("label_name")}</label><input type="text" id="newTeamName" required placeholder="${SV.t("placeholder_team_name")}"></div>
        <div><label>${SV.t("label_password_optional")}</label><input type="password" id="newTeamPw"></div>
        <div style="flex:0;"><button type="submit">${SV.t("btn_create")}</button></div>
      </form>
    </div>
    <div class="card"><h2>${SV.t("teams_existing_h2")}</h2>${rows}</div>
  `;
};

SV.actions.createTeam = async function(ev){
  ev.preventDefault();
  const name = SV.util.byId("newTeamName").value.trim();
  const pw = SV.util.byId("newTeamPw").value;
  if(!name) return;
  const team = await SV.store.createTeam(name, pw);
  SV.state.teams.push(team);
  SV.state.currentTeamId = team.id;
  SV.ui.toast(SV.t("toast_team_created"));
  location.hash = "#/agendas";
};

SV.actions.selectTeam = function(id){
  const team = SV.state.teams.find(t=>t.id===id);
  if(team && !team.passwordProtected) SV.store.unlockedKeys[id] = null;
  SV.state.currentTeamId = id;
  location.hash = "#/agendas";
};

SV.actions.unlockTeam = async function(id){
  const pwEl = SV.util.byId("pw-"+id);
  const pw = pwEl ? pwEl.value : "";
  const team = SV.state.teams.find(t=>t.id===id);
  const ok = await SV.store.unlockWithPassword(team, pw);
  if(!ok){ SV.ui.toast(SV.t("toast_wrong_password")); return; }
  SV.state.currentTeamId = id;
  location.hash = "#/agendas";
};

SV.actions.deleteTeam = async function(id){
  const team = SV.state.teams.find(t=>t.id===id);
  if(team.passwordProtected && !SV.store.isUnlocked(id)){
    SV.ui.toast(SV.t("toast_unlock_first"));
    return;
  }
  if(!await SV.ui.confirm(SV.t("confirm_delete_team", team.name))) return;
  await SV.store.deleteTeam(id);
  if(SV.state.currentTeamId===id) SV.state.currentTeamId = null;
  SV.router.go();
};

SV.actions.logoutTeam = function(){
  if(SV.state.currentTeamId) SV.store.lock(SV.state.currentTeamId);
  SV.state.currentTeamId = null;
  location.hash = "#/teams";
};

/* ---------- gemeinsame Bausteine: Textbloecke / Aufgaben / Antraege je TOP ---------- */
// Rendert genau EINEN Textblock (Label + Inhalt bzw. Textarea+Buttons im
// editierbaren Fall). Ausgelagert aus renderBlocksSection (Version 1.8.0),
// damit die TOP-Detailansicht den Vorbereitungs- bzw. den Haupt-Meeting-
// Protokoll-Block auch einzeln, ohne die umschliessende <details>-Liste,
// darstellen kann.
SV.views._blockRow = function(kind, containerId, item, b, editable){
  const taId = `blk-${b.id}`;
  const kindLabel = b.kind==="prep" ? SV.t("block_label_prep") : (b.kind==="protokoll" ? SV.t("block_label_protokoll") : "");
  const labelHtml = kindLabel ? `<div class="small muted" style="margin-bottom:2px;"><strong>${kindLabel}</strong></div>` : "";
  if(!editable) return `<div class="small" style="margin-bottom:6px;">${labelHtml}${SV.textformat.renderSegmentsHtml(b.content)}</div>`;
  return `<div style="margin-bottom:8px;">
    ${labelHtml}
    <textarea id="${taId}">${SV.util.esc(b.content)}</textarea>
    <div class="btn-row" style="margin-top:4px;">
      <button class="secondary" onclick="SV.actions.editBlock('${kind}','${containerId}','${item.id}','${b.id}','${taId}')">${SV.t("btn_save")}</button>
      <button class="danger" onclick="SV.actions.deleteBlock('${kind}','${containerId}','${item.id}','${b.id}')">${SV.t("btn_delete")}</button>
    </div>
  </div>`;
};

SV.views.renderBlocksSection = function(kind, containerId, item, editable){
  const n = item.blocks.length;
  const rows = item.blocks.map(b=> SV.views._blockRow(kind, containerId, item, b, editable)).join("");
  const trash = (item.geloeschte_blocks||[]).length ? `
    <details><summary class="small">${SV.t("deleted_blocks_summary", item.geloeschte_blocks.length)}</summary>
      ${item.geloeschte_blocks.map(b=>`<div class="small muted" style="margin:4px 0;">${SV.util.esc((b.content||"").slice(0,60))}…
        <button class="secondary" style="padding:2px 8px;" onclick="SV.actions.restoreBlock('${kind}','${containerId}','${item.id}','${b.id}')">${SV.t("btn_restore")}</button></div>`).join("")}
    </details>` : "";
  const addForm = editable ? `
    <div style="margin-top:6px;">
      <textarea id="newblk-${item.id}" placeholder="${SV.t("placeholder_block_text")}"></textarea>
      <button class="secondary" style="margin-top:4px;" onclick="SV.actions.addBlock('${kind}','${containerId}','${item.id}','newblk-${item.id}')">${n?SV.t("btn_add_block_more"):SV.t("btn_add_block")}</button>
    </div>` : "";
  return `<details ${n?"":""}><summary>${SV.t("blocks_summary", n)}</summary><div style="margin-top:6px;">${rows}${trash}${addForm}</div></details>`;
};

SV.views.renderTasksSection = function(kind, containerId, item, editable){

SV.actions.editTaskFull = async function(kind, containerId, itemId, taskId){
  const text = SV.util.byId(`txt-${taskId}`).value;
  const ver = SV.util.byId(`ver-${taskId}`).value.trim();
  const ter = SV.util.byId(`ter-${taskId}`).value;
  const st = SV.util.byId(`st-${taskId}`).value;
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    const t = it.aufgaben.find(x=>x.id===taskId);
    if(t){ t.text = SV.textformat.cleanBlockContent(text); t.verantwortlich=ver; t.termin=ter; t.status=st; }
  });
  SV.actions._refresh();
};

// Ergebnis-Werte bleiben intern immer deutsche Token (gespeicherte Fachdaten,
// kompatibel mit Export/Import); nur die ANZEIGE wird übersetzt - siehe
// SV.beschluss.label(). Deshalb jetzt ueberall explizites value="..." an den
// <option>-Elementen (vorher war Text==Wert, das würde die Übersetzung sonst
// versehentlich zum neuen Speicherwert machen).
SV.beschluss = {
  ERG: [
    {value:"offen", key:"erg_offen"}, {value:"angenommen", key:"erg_angenommen"},
    {value:"abgelehnt", key:"erg_abgelehnt"}, {value:"vertagt", key:"erg_vertagt"},
    {value:"zurückgezogen", key:"erg_zurueckgezogen"},
  ],
  label(v){ const e = SV.beschluss.ERG.find(x=>x.value===v); return e ? SV.t(e.key) : v; },
};

SV.views.renderAntraegeSection = function(kind, containerId, item, editable, autoOpen){
  const n = item.antraege.length;
  const ergOptions = (selected)=> SV.beschluss.ERG.map(e=>`<option value="${e.value}" ${e.value===selected?"selected":""}>${SV.beschluss.label(e.value)}</option>`).join("");

        <div><label>${SV.t("label_enthaltung")}</label><input type="number" min="0" id="aenth-${a.id}" value="${a.enthaltung}"></div>

      <div class="btn-row" style="margin-top:6px;">

SV.actions.addAttachment = async function(kind, containerId, itemId, fileInputId, capId, dispId, fnId){
  const fileInput = SV.util.byId(fileInputId);
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(!file){ SV.ui.toast(SV.t("toast_select_file")); return; }
  const detectedKind = SV.model.attachmentKind(file.name);
  if(!detectedKind){ SV.ui.toast(SV.t("toast_unsupported_filetype")); return; }
  const caption = SV.util.byId(capId).value.trim();
  const display = SV.util.byId(dispId).value;
  const showFilename = SV.util.byId(fnId).checked;
  const attachment = SV.model.newAttachment(file.name, display, caption);
  attachment.showFilename = showFilename;
  try{
    await SV.store.saveAttachmentFile(SV.state.currentTeamId, kind+"-"+itemId, attachment.id, file);
  }catch(e){
    SV.ui.toast(e && e.message==="TEAM_LOCKED" ? SV.t("toast_team_locked") : SV.t("toast_file_save_failed"));
    return;
  }
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    it.anhaenge = it.anhaenge || [];
    it.anhaenge.push(attachment);
  });
  SV.actions._refresh();
};
SV.actions.editAttachment = async function(kind, containerId, itemId, attachmentId){
  const caption = SV.util.byId(`atc-${attachmentId}`).value.trim();
  const display = SV.util.byId(`atd-${attachmentId}`).value;
  const showFilename = SV.util.byId(`atf-${attachmentId}`).checked;
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    const at = (it.anhaenge||[]).find(x=>x.id===attachmentId);
    if(at){ at.caption=caption; at.display = display==="verborgen"?"verborgen":"anhang"; at.showFilename=showFilename; }
  });
  SV.actions._refresh();
};
SV.actions.deleteAttachment = async function(kind, containerId, itemId, attachmentId){
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    const at = (it.anhaenge||[]).find(x=>x.id===attachmentId);
    if(at){
      at.deleted_at = SV.util.nowIso();
      it.geloeschte_anhaenge = it.geloeschte_anhaenge || [];
      it.geloeschte_anhaenge.push(at);
      it.anhaenge = it.anhaenge.filter(x=>x.id!==attachmentId);
    }
  });
  SV.actions._refresh();
};
SV.actions.restoreAttachment = async function(kind, containerId, itemId, attachmentId){
  await SV.actions._mutate(kind, containerId, (c)=>{
    const it = c.items.find(x=>x.id===itemId);
    const at = (it.geloeschte_anhaenge||[]).find(x=>x.id===attachmentId);
    if(at){
      delete at.deleted_at;
      it.geloeschte_anhaenge = it.geloeschte_anhaenge.filter(x=>x.id!==attachmentId);
      it.anhaenge = it.anhaenge || [];
      it.anhaenge.push(at);
    }
  });
  SV.actions._refresh();
};
// Oeffnet einen Anhang (entschluesselt bei Bedarf) in einem neuen Tab/Fenster.
// Das Zielfenster wird SOFORT (noch im Klick-Handler) geoeffnet, bevor
// asynchron entschluesselt wird - sonst blockieren manche Browser (v.a.
// Safari auf iPad/iPhone) das Popup, weil der Nutzergesten-Kontext nach
// einem await verloren geht.
SV.actions.openAttachment = async function(attachmentId){
  const win = window.open("", "_blank");
  try{
    const blob = await SV.store.getAttachmentBlob(SV.state.currentTeamId, attachmentId);
    if(!blob){ if(win) win.close(); SV.ui.toast(SV.t("toast_attachment_not_found")); return; }
    const url = URL.createObjectURL(blob);
    if(win){ win.location.href = url; }
    else { SV.util.downloadBlob(blob, "anhang"); }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){
    if(win) win.close();
    SV.ui.toast(e && e.message==="TEAM_LOCKED" ? SV.t("toast_team_locked") : SV.t("toast_attachment_open_failed"));
  }
};

/* ---------- Agenden ---------- */
SV.views._meetingsByAgenda = async function(teamId){
  const meetings = await SV.store.listMeetings(teamId);
  const map = {};
  meetings.forEach(m=>{
    if(m.agenda_id){ (map[m.agenda_id] = map[m.agenda_id]||[]).push(m); }
  });
  Object.values(map).forEach(list=> list.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.created_at||"").localeCompare(a.created_at||"")));
  return map;
};
