/* ---------- Zweigeteilte Sitzungsansicht (Version 1.9.0) ----------
   Ersetzt die getrennten Ansichten "TOP-Liste" (SV.views.meetingRun bis
   1.8.0) und "TOP-Detailansicht" (SV.views.meetingItemDetail bis 1.8.0)
   durch EINE Ansicht mit zwei Spalten: links eine immer sichtbare, schlanke
   Gesamtuebersicht aller TOPs (Abhaken, Verschieben, Reihenfolge), rechts
   der jeweils ausgewaehlte TOP in voller Ausfuehrlichkeit (Vorbereitung,
   Protokoll, Anhaenge, Antraege, Aufgaben, weitere Textfelder, restliche
   Aktionen wie Einruecken/als gestrichen markieren/Loeschen). Auf schmalen
   Bildschirmen (Handy) bleibt es einspaltig: ohne Auswahl sieht man nur die
   Liste, mit Auswahl nur die Detailansicht (ueber die CSS-Klasse
   "has-selection", siehe Media Query bei .meeting-split).
   itemId ist optional - ohne Auswahl zeigt die rechte Spalte nur einen
   Hinweistext (und bleibt auf dem Handy ausgeblendet). */
SV.views.meetingRun = async function(app, meetingId, itemId){
  const teamId = SV.state.currentTeamId;
  let meeting = await SV.store.getMeeting(teamId, meetingId);
  if(!meeting){ app.innerHTML = `<div class="card">${SV.t("meeting_not_found")} <a href="#/meetings">${SV.t("back_generic")}</a></div>`; return; }
  if(meeting.status === "abgeschlossen") return SV.views.meetingView(app, meeting);

  // Backfill (Version 1.7.0): jedes Meeting-Item bekommt spaetestens hier einen
  // "Meeting Protokoll"-Block, falls es noch keinen hat - diese Funktion reicht
  // als einzige Absicherung, weil meetingRun architekturbedingt nur fuer noch
  // nicht abgeschlossene Sitzungen erreicht wird (s. Redirect oben). IMMER ein
  // neuer, leerer Block - nie ein bestehender Block wird umetikettiert.
  let meetingChanged = false;
  (meeting.items||[]).forEach(it=>{ if(SV.model.ensureProtokollBlock(it)) meetingChanged = true; });
  if(meetingChanged) await SV.store.saveMeeting(teamId, meeting);

  let item = itemId ? (meeting.items||[]).find(x=>x.id===itemId) : null;
  if(itemId && !item){
    app.innerHTML = `<div class="card">${SV.t("item_not_found")} <a href="javascript:void(0)" onclick="SV.actions.leaveMeetingItem('${meeting.id}')">${SV.t("back_to_meeting_items")}</a></div>`;
    return;
  }

  if(item){
    // Uhr automatisch starten (sofern Einstellung aktiv und kein anderer
    // TOP-Timer dieser Sitzung laeuft) - ohne bereits vorhandene Zeit zu
    // verwerfen, damit ein erneutes Oeffnen die Uhr wie gewünscht einfach
    // weiterlaufen laesst. NUR beim frischen Oeffnen dieses TOPs pruefen,
    // nicht bei jedem Re-Render dieser Ansicht (sonst wuerde z.B. das
    // manuelle Stoppen ueber den Balken die Uhr durch den folgenden
    // Re-Render sofort wieder automatisch starten).
    const freshOpen = SV.state._autoStartDoneForItem !== item.id;
    if(freshOpen){
      SV.state._autoStartDoneForItem = item.id;
      const runningElsewhere = (meeting.items||[]).some(it=>it.id!==item.id && it.timerRunningSince);
      // Ein bereits als "bearbeitet" markierter TOP startet beim erneuten
      // Oeffnen die Uhr NICHT automatisch weiter (Version 1.8.0) - sie bleibt
      // stehen, laesst sich aber ueber den Timer-Balken jederzeit manuell
      // wieder starten.
      if(SV.settings.autoStartTimer && !item.done && !item.timerRunningSince && !runningElsewhere){
        await SV.actions._mutate("meeting", meetingId, (c)=>{
          const it = c.items.find(x=>x.id===item.id);
          if(it && !it.timerRunningSince) it.timerRunningSince = SV.util.nowIso();
        });
        meeting = await SV.store.getMeeting(teamId, meetingId);
        item = meeting.items.find(x=>x.id===itemId);
      }
    }
  }

  const numbered = SV.model.numberedItems(meeting.items);
  const STATUS_LABEL = {normal:SV.t("status_label_normal"), verschoben:SV.t("status_label_verschoben"), gestrichen:SV.t("status_label_gestrichen")};

  // Fuer das "Verschieben"-Formular (nur noch links in der Uebersicht, seit
  // Version 1.9.0): alle Agenden dieses Teams als moegliches Ziel (oder
  // "neue Agenda anlegen"), sowie eine Id->Titel-Zuordnung fuer das
  // "verschoben in ..."-Tag neben einem bereits verschobenen TOP.
  const agendas = await SV.store.listAgendas(teamId);
  const agendaTitleById = {}; agendas.forEach(a=> agendaTitleById[a.id] = a.title || SV.t("no_title"));

  const moveForm = (it)=> `
    <details class="move-form">
      <summary class="btn-toggle"><span class="lbl-closed">${SV.t("btn_move_to_agenda")}</span><span class="lbl-open">${SV.t("btn_move_to_agenda")}</span></summary>
      <div style="margin-top:6px;">
        <label>${SV.t("label_move_target_agenda")}</label>
        <select id="movesel-${it.id}">
          <option value="">—</option>
          ${agendas.map(a=>`<option value="${a.id}">${SV.util.esc(a.title)||SV.t("no_title")}</option>`).join("")}
          <option value="__new__">${SV.t("opt_new_agenda")}</option>
        </select>
        <label style="margin-top:4px;">${SV.t("label_new_agenda_title")}</label>
        <input type="text" id="movetitle-${it.id}" placeholder="${SV.t("placeholder_agenda_title")}">
        <button class="secondary" style="margin-top:6px;" onclick="SV.actions.moveItemToAgenda('${meeting.id}','${it.id}','movesel-${it.id}','movetitle-${it.id}')">${SV.t("btn_confirm_move")}</button>
      </div>
    </details>`;

  // ---- linke Spalte: schlanke Gesamtuebersicht aller TOPs ----
  // Je Zeile: Nummer, Abhaken, Titel (oeffnet rechts die Detailansicht),
  // verstrichene Zeit/Status-Tag, Reihenfolge (↑↓) und das kleine
  // Verschieben-Feld. Einruecken (←→), oeffentlich/nicht-oeffentlich,
  // gestrichen-markieren und Loeschen stehen seit Version 1.9.0 nur noch
  // rechts bei der Detailansicht, um die Uebersicht schlank zu halten.
  const leftRowsHtml = numbered.map(({item:it,number,depth})=>`
    <div class="top-row ${depth?'sub':''} ${it.done?'done':''} ${it.status!=='normal'?'inactive':''} ${item && item.id===it.id?'selected':''}" id="top-${it.id}">
      <div class="top-row-head">
        <div class="trh-num">${number}</div>
        <div class="trh-done">
          <button class="secondary btn-done ${it.done?'active':''}" title="${it.done?SV.t('tip_mark_undone'):SV.t('tip_mark_done')}" onclick="SV.actions.toggleItemDone('${meeting.id}','${it.id}')">${it.done?'✓':'○'}</button>
        </div>
        <div class="trh-title">
          <a href="#/meetings/${meeting.id}/items/${it.id}" class="top-row-title" style="${it.done?'opacity:.6;':''}">${SV.util.esc(it.title)}</a>
          ${(it.timerElapsedMs||it.timerRunningSince) ? `<span class="muted small"> · ⏱ ${SV.timer.fmt(SV.timer.liveElapsedMs(it))}</span>` : ``}
          <div class="small muted">
            ${it.public?``:`<span class="tag">${SV.t("tag_not_public")}</span>`}
            ${it.status!=='normal' ? (it.status==='verschoben' && it.verschobenZuAgendaId
              ? `<span class="tag status">${SV.t("tag_moved_to", agendaTitleById[it.verschobenZuAgendaId]||"?")}</span>`
              : `<span class="tag status">${STATUS_LABEL[it.status]}</span>`) : ``}
          </div>
        </div>
        <div class="top-row-actions">
          <button class="secondary" title="${SV.t('tip_move_up')}" onclick="SV.actions.moveItem('meeting','${meeting.id}','${it.id}','up')">↑</button>
          <button class="secondary" title="${SV.t('tip_move_down')}" onclick="SV.actions.moveItem('meeting','${meeting.id}','${it.id}','down')">↓</button>
        </div>
      </div>
      ${it.status==='normal' ? moveForm(it) : ``}
    </div>`).join("");

  // ---- rechte Spalte: Detailansicht des ausgewaehlten TOPs (oder Hinweis) ----
  let rightHtml = `<div class="split-right-empty">${SV.t("hint_select_top")}</div>`;
  if(item){
    if(SV.model.ensureProtokollBlock(item)) await SV.store.saveMeeting(teamId, meeting);

    const timerBar = `
      <div id="runningTimerBar" class="card" style="background:${item.timerRunningSince?'#fff3da':'#f5f6f7'}; border-color:${item.timerRunningSince?'#e0c48c':'var(--border)'}; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <strong style="margin:0;">⏱</strong>
        <span id="runningTimerDisplay" style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:1.1rem; font-weight:600; ${item.timerRunningSince?'color:#8a5a00;':''}">${SV.timer.fmt(SV.timer.liveElapsedMs(item))}</span>
        <button class="secondary" style="margin-left:auto;" onclick="SV.actions.toggleItemTimer('${meeting.id}','${item.id}')">${item.timerRunningSince?SV.t("btn_timer_stop_bar"):SV.t("tip_timer_start")}</button>
      </div>`;

    // Inhaltsabhaengige Abschnitte (Version 1.8.0): Vorbereitung und das
    // Haupt-Meeting-Protokoll werden immer direkt angezeigt (kein Button
    // notwendig); Anhaenge und Antraege/Beschluesse werden angezeigt, wenn
    // schon etwas vorhanden ist, sonst stehen sie hinter ihrem eigenen
    // (ohnehin vorhandenen) Aufklapp-Button; Aufgaben und "weitere
    // Textfelder" stehen IMMER hinter einem Button, unabhaengig vom Inhalt.
    const prepBlock = (item.blocks||[]).find(b=>b.kind==="prep");
    const mainProtokollBlock = (item.blocks||[]).find(b=>b.kind==="protokoll");
    const extraBlocks = (item.blocks||[]).filter(b=> b!==prepBlock && b!==mainProtokollBlock);
    const prepHtml = prepBlock ? SV.views._blockRow("meeting", meeting.id, item, prepBlock, true) : "";
    const protokollHtml = mainProtokollBlock ? SV.views._blockRow("meeting", meeting.id, item, mainProtokollBlock, true) : "";
    const extraRows = extraBlocks.map(b=> SV.views._blockRow("meeting", meeting.id, item, b, true)).join("");
    const extraTrash = (item.geloeschte_blocks||[]).length ? `
      <details><summary class="small">${SV.t("deleted_blocks_summary", item.geloeschte_blocks.length)}</summary>
        ${item.geloeschte_blocks.map(b=>`<div class="small muted" style="margin:4px 0;">${SV.util.esc((b.content||"").slice(0,60))}…
          <button class="secondary" style="padding:2px 8px;" onclick="SV.actions.restoreBlock('meeting','${meeting.id}','${item.id}','${b.id}')">${SV.t("btn_restore")}</button></div>`).join("")}
      </details>` : "";
    const extraAddForm = `
      <div style="margin-top:6px;">
        <textarea id="newblk-${item.id}" placeholder="${SV.t("placeholder_block_text")}"></textarea>
        <button class="secondary" style="margin-top:4px;" onclick="SV.actions.addBlock('meeting','${meeting.id}','${item.id}','newblk-${item.id}')">${extraBlocks.length?SV.t("btn_add_block_more"):SV.t("btn_add_block")}</button>
      </div>`;
    const extraBlocksSection = `
      <details>
        <summary class="btn-toggle"><span class="lbl-closed">${SV.t("summary_more_fields")}</span><span class="lbl-open">${SV.t("summary_more_fields")}</span></summary>
        <div style="margin-top:6px;">${extraRows}${extraTrash}${extraAddForm}</div>
      </details>`;

    rightHtml = `
      <p><a href="javascript:void(0)" onclick="SV.actions.leaveMeetingItem('${meeting.id}')">${SV.t("back_to_meeting_items")}</a></p>
      ${timerBar}
      <div class="card">
        <div class="row" style="align-items:center;">
          <div style="flex:0;">
            <button class="secondary btn-done ${item.done?'active':''}" title="${item.done?SV.t('tip_mark_undone'):SV.t('tip_mark_done')}" onclick="SV.actions.toggleItemDone('${meeting.id}','${item.id}')">${item.done?'✓':'○'}</button>
          </div>
          <div><input type="text" id="title-${item.id}" value="${SV.util.esc(item.title)}" style="${item.done?'opacity:.6;':''}"></div>
          <div style="flex:0;"><button class="secondary" onclick="SV.actions.editItemTitle('meeting','${meeting.id}','${item.id}','title-${item.id}')">${SV.t("btn_save")}</button></div>
        </div>
        <div class="small muted" style="margin-top:2px;">
          ${item.public?``:`<span class="tag">${SV.t("tag_not_public")}</span>`}
          ${item.status!=='normal' ? (item.status==='verschoben' && item.verschobenZuAgendaId
            ? `<span class="tag status">${SV.t("tag_moved_to", agendaTitleById[item.verschobenZuAgendaId]||"?")}</span>`
            : `<span class="tag status">${STATUS_LABEL[item.status]}</span>`) : ``}
        </div>
        <div class="actions">

SV.actions.leaveMeetingItem = async function(meetingId){
  // Haelt einen eventuell laufenden TOP-Timer dieser Sitzung an, bevor man zur
  // Agenda (Liste der TOPs) zurueckspringt - "wenn man aber den TOP erneut
  // oeffnet, laeuft die Uhr weiter" gilt nur fuer das erneute OEFFNEN desselben
  // TOPs, nicht fuer das Zurueckspringen selbst.
  await SV.actions._mutate("meeting", meetingId, (c)=>{
    const nowMs = Date.now();
    (c.items||[]).forEach(it=>{
      if(it.timerRunningSince){
        it.timerElapsedMs = (it.timerElapsedMs||0) + (nowMs - new Date(it.timerRunningSince).getTime());
        it.timerRunningSince = null;
      }
    });
  });
  SV.state._autoStartDoneForItem = null;
  location.hash = "#/meetings/"+meetingId;
};

SV.actions.updateMeetingMeta = async function(ev, meetingId){
  ev.preventDefault();
  const title = SV.util.byId("editMeetingTitle").value.trim();
  const date = SV.util.byId("editMeetingDate").value;
  if(!title){ SV.ui.toast(SV.t("toast_title_required")); return; }
  await SV.actions._mutate("meeting", meetingId, (c)=>{ c.title=title; c.date=date; });
  SV.router.go();
};
SV.actions.toggleShowTimerInProtocol = async function(meetingId, checked){
  await SV.actions._mutate("meeting", meetingId, (c)=>{ c.showTimerInProtocol = !!checked; });
  // Kein volles Re-Render noetig (keine sichtbare Aenderung ausser der Checkbox selbst,
  // die bereits den richtigen Zustand zeigt) - so bleibt ein offenes Textfeld unangetastet.
};
SV.actions.toggleItemDone = async function(meetingId, itemId){
  await SV.actions._mutate("meeting", meetingId, (c)=>{
    const it = (c.items||[]).find(x=>x.id===itemId);
    if(it) it.done = !it.done;
  });
  SV.router.go();
};
SV.actions.toggleItemTimer = async function(meetingId, itemId){
  await SV.actions._mutate("meeting", meetingId, (c)=>{
    const nowMs = Date.now();
    const target = (c.items||[]).find(x=>x.id===itemId);
    if(!target) return;
    // Nur ein TOP-Timer gleichzeitig: einen anderen laufenden Timer in dieser Sitzung
    // zuerst stoppen und seine Zeit sichern.
    (c.items||[]).forEach(it=>{
      if(it.id!==itemId && it.timerRunningSince){
        it.timerElapsedMs = (it.timerElapsedMs||0) + (nowMs - new Date(it.timerRunningSince).getTime());
        it.timerRunningSince = null;
      }
    });
    if(target.timerRunningSince){
      target.timerElapsedMs = (target.timerElapsedMs||0) + (nowMs - new Date(target.timerRunningSince).getTime());
      target.timerRunningSince = null;
    } else {
      target.timerRunningSince = SV.util.nowIso();
    }
  });
  SV.router.go();
};
SV.actions.completeMeeting = async function(meetingId){
  if(!await SV.ui.confirm(SV.t("confirm_complete_meeting"))) return;
  await SV.actions._mutate("meeting", meetingId, (c)=>{ c.status="abgeschlossen"; c.completed_at=SV.util.nowIso(); });
  SV.router.go();
};
SV.actions.reopenMeeting = async function(meetingId){
  if(!await SV.ui.confirm(SV.t("confirm_reopen_meeting"))) return;
  await SV.actions._mutate("meeting", meetingId, (c)=>{ c.status="laufend"; });
  SV.router.go();
};

SV.views._collectBeschluesse = async function(teamId){
  const meetings = await SV.store.listMeetings(teamId);
  const out = [];
  meetings.forEach(m=>{
    (m.items||[]).forEach(it=>{
      (it.antraege||[]).forEach(a=> out.push({a, meeting:m, item:it}));
    });
  });
  out.sort((x,y)=> (y.meeting.date||"").localeCompare(x.meeting.date||""));
  return out;
};

SV.actions.jumpToItem = async function(kind, containerId, itemId){
  // Ein laufendes (noch nicht abgeschlossenes) Meeting oeffnet den TOP direkt
  // in seiner eigenen Detailansicht statt nur zu ihm zu scrollen.
  if(kind==="meeting"){
    const teamId = SV.state.currentTeamId;
    const meeting = teamId ? await SV.store.getMeeting(teamId, containerId) : null;
    if(meeting && meeting.status !== "abgeschlossen"){
      location.hash = "#/meetings/"+containerId+"/items/"+itemId;
      return;
    }
  }
  SV.state.scrollTarget = (kind==="meeting"?"top-":"item-") + itemId;
  location.hash = kind==="meeting" ? "#/meetings/"+containerId : "#/agendas/"+containerId;
};

/* ---------- Aufgaben (teamübergreifend) ---------- */
SV.aufgaben = {
  STATUS: ["neu","in_arbeit","zurueckgestellt","gestoppt","erledigt"],
  statusLabel(s){ return SV.t("status_"+s) || s; },

  async collect(teamIds){
    const out = [];
    for(const teamId of teamIds){
      if(!SV.store.isUnlocked(teamId)) continue;
      const team = SV.state.teams.find(t=>t.id===teamId);
      const agendas = await SV.store.listAgendas(teamId);
      const meetings = await SV.store.listMeetings(teamId);
      const addFrom = (containers, kind)=>{
        containers.forEach(c=>{
          (c.items||[]).forEach(it=>{
            (it.aufgaben||[]).forEach(t=> out.push({
              teamId, teamName: team?team.name:"?", kind, containerId:c.id, itemId:it.id, task:t,
              containerTitle: c.title, containerDate: c.date, containerStatus: kind==="meeting"?c.status:null,
            }));
          });
        });
      };
      addFrom(agendas, "agenda");
      addFrom(meetings, "meeting");
    }
    return out;
  },
};

SV.actions.unlockForAufgaben = async function(teamId){

// Exportiert je nach Einstellung (SV.settings.exportMode): eine gemeinsame Datei
// fuer alle Teams ("single"), eine eigene Datei pro Team ("perTeam", Default auf
// Nutzerwunsch - erleichtert z.B. die Weitergabe eines einzelnen Teams), oder nur
// das aktuell ausgewaehlte Team ("currentTeam", ebenfalls auf Nutzerwunsch).
SV.actions.exportAll = async function(){
  const teams = await SV.idb.getAll("teams");
  if(!teams.length){ SV.ui.toast(SV.t("toast_no_teams_to_export")); return; }
  const stamp = SV.util.nowIso().slice(0,10);

  if(SV.settings.exportMode === "currentTeam"){
    const current = SV.state.currentTeam;
    if(!current){ SV.ui.toast(SV.t("toast_no_current_team")); return; }
    const dump = await SV.store.exportTeam(current.id);
    const blob = new Blob([JSON.stringify(dump)], {type:"application/json"});
    SV.util.downloadBlob(blob, `meetingdb-${SV.util.safeFilenamePart(current.name)}-${stamp}.meetingdb.json`);
    SV.ui.toast(SV.t("toast_export_done"));
    return;
  }

  if(SV.settings.exportMode === "single"){
    const dump = await SV.store.exportAll();
    const blob = new Blob([JSON.stringify(dump)], {type:"application/json"});
    SV.util.downloadBlob(blob, `meetingdb-${stamp}.meetingdb.json`);
    SV.ui.toast(SV.t("toast_export_done"));
    return;
  }
  for(const team of teams){
    const dump = await SV.store.exportTeam(team.id);
    if(!dump) continue;
    const blob = new Blob([JSON.stringify(dump)], {type:"application/json"});
    SV.util.downloadBlob(blob, `meetingdb-${SV.util.safeFilenamePart(team.name)}-${stamp}.meetingdb.json`);
  }
  SV.ui.toast(teams.length===1 ? SV.t("toast_export_done") : SV.t("toast_export_done_many", teams.length));
};
// Liest eine oder mehrere ausgewaehlte Dateien ein (z.B. mehrere Team-Dateien
// auf einmal) und summiert das Ergebnis; eine einzelne nicht lesbare Datei
// bricht den restlichen Import nicht ab.
SV.actions.importAll = async function(){
  const fileEl = SV.util.byId("importFile");
  const files = Array.from(fileEl.files || []);
  if(!files.length){ SV.ui.toast(SV.t("toast_select_file_first")); return; }
  let added=0, updated=0, skipped=0, failed=0;
  for(const file of files){
    let dump;
    try{
      const text = await file.text();
      dump = JSON.parse(text);
    }catch(e){ failed++; continue; }
    try{
      const res = await SV.store.importAll(dump);
      added += res.added; updated += res.updated; skipped += res.skipped;
    }catch(e){ failed++; }
  }
  let msg = SV.t("toast_import_done", added, updated, skipped);
  if(failed>0) msg += " " + SV.t("toast_import_files_failed", failed);
  SV.ui.toast(msg);
  SV.router.go();
};

/* ===================== PDF-Export (jsPDF) ===================== */
SV.pdf = {
  MARGIN: 18,

  newDoc(orientation){
    const doc = new window.jspdf.jsPDF({orientation: orientation==="L"?"l":"p", unit:"mm", format:"a4"});
    doc.setFont("helvetica", "normal");
    return doc;
  },
  newState(doc){
    return { y: SV.pdf.MARGIN, doc, pageW: doc.internal.pageSize.getWidth(), pageH: doc.internal.pageSize.getHeight() };
  },
  usableWidth(state){ return state.pageW - 2*SV.pdf.MARGIN; },
  ensure(state, needed){
    if(state.y + needed > state.pageH - SV.pdf.MARGIN){
      state.doc.addPage();
      state.y = SV.pdf.MARGIN;
    }
  },
  text(state, str, opts){
    opts = opts || {};
    const size = opts.size || 11;
    const style = opts.bold ? "bold" : "normal";
    const indent = opts.indent || 0;
    state.doc.setFont("helvetica", style);
    state.doc.setFontSize(size);
    const maxW = SV.pdf.usableWidth(state) - indent;
    const lines = state.doc.splitTextToSize(str, maxW);
    const lh = (opts.lineHeight || (size*0.42));
    SV.pdf.ensure(state, lines.length*lh + (opts.before||0));
    state.y += (opts.before||0);
    lines.forEach(line=>{
      SV.pdf.ensure(state, lh);
      state.doc.text(line, SV.pdf.MARGIN+indent, state.y);
      state.y += lh;
    });
    state.y += (opts.after||0);
  },
  bulletLine(state, marker, str, indentMm, size){
    size = size || 10.5;
    const doc = state.doc;
    doc.setFont("helvetica","normal"); doc.setFontSize(size);
    const markerW = 6;
    const maxW = SV.pdf.usableWidth(state) - indentMm - markerW;
    const lines = doc.splitTextToSize(str, Math.max(maxW,20));
    const lh = size*0.42;
    lines.forEach((line,i)=>{
      SV.pdf.ensure(state, lh);
      if(i===0) doc.text(marker, SV.pdf.MARGIN+indentMm, state.y);
      doc.text(line, SV.pdf.MARGIN+indentMm+markerW, state.y);
      state.y += lh;
    });
  },
  segments(state, content, indentBase){
    indentBase = indentBase || 0;
    const segs = SV.textformat.parseBlockSegments(content);
    segs.forEach(seg=>{
      if(seg.type==="text"){
        const t = seg.text.replace(/^\n+|\n+$/g,"");
        if(t.trim()==="") return;
        t.split("\n").forEach(line=>{
          if(line.trim()==="") { state.y += 2; return; }
          SV.pdf.text(state, line, {indent:indentBase, size:10.5});
        });
      } else {
        const marker = seg.depth===0 ? "•" : "–";
        const indentMm = indentBase + (seg.depth===0 ? 2 : 8 + (seg.depth-1)*8);
        seg.items.forEach(it=> SV.pdf.bulletLine(state, marker, it, indentMm));
      }
    });
  },
  header(state, title, subtitle){
    SV.pdf.text(state, title, {size:16, bold:true});
    if(subtitle) SV.pdf.text(state, subtitle, {size:10, after:4});
    state.y += 2;
  },
  table(state, headers, rows, colWidths){
    const doc = state.doc;
    const pad = 1.5, lh = 4;
    const cellLines = (txt, w)=>{
      doc.setFontSize(8.5);
      return doc.splitTextToSize(String(txt==null?"":txt), w-2*pad);
    };
    const drawRow = (cells, bold)=>{
      const linesPerCell = cells.map((c,i)=>cellLines(c, colWidths[i]));
      const maxLines = Math.max(...linesPerCell.map(l=>l.length), 1);
      const rowH = maxLines*lh + 2*pad;
      SV.pdf.ensure(state, rowH);
      let x = SV.pdf.MARGIN;
      doc.setFont("helvetica", bold?"bold":"normal");
      cells.forEach((c,i)=>{
        doc.rect(x, state.y, colWidths[i], rowH);
        linesPerCell[i].forEach((line,li)=> doc.text(line, x+pad, state.y+pad+lh*0.75+li*lh));
        x += colWidths[i];
      });
      state.y += rowH;
    };
    drawRow(headers, true);
    rows.forEach(r=> drawRow(r, false));
  },
  save(doc, filename){ doc.save(filename); },

  /* ---------- Anhänge in PDF-Exporten (echtes Zusammenfügen) ----------
     Bilder werden ueber ein Canvas in JPEG umgewandelt und als normale
     jsPDF-Seite eingefuegt (robust gegenueber Bild-Format/Browser).
     PDF-Anhaenge koennen von jsPDF nicht eingebettet werden - dafuer wird
     das fertige jsPDF-Dokument am Ende per pdf-lib geladen und die echten
     Seiten der angehaengten PDF-Dateien werden dahinter kopiert (mit einer
     Trennseite davor). Ein einzelner defekter/fehlender Anhang ueberspringt
     sich selbst (try/catch), der Rest des Exports bleibt unversehrt. */
  attachmentLabel(at){
    if(at.caption && at.showFilename) return `${at.caption} (${at.filename})`;
    if(at.caption) return at.caption;
    return at.filename;
  },
  async imageBlobToJpeg(blob){
    const url = URL.createObjectURL(blob);
    try{
      const img = await new Promise((resolve, reject)=>{
        const im = new Image();
        im.onload = ()=>resolve(im);
        im.onerror = ()=>reject(new Error(SV.t("img_load_error")));
        im.src = url;
      });
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); // falls Transparenz (PNG)
      ctx.drawImage(img, 0, 0);
      return { dataUrl: canvas.toDataURL("image/jpeg", 0.92), width: canvas.width, height: canvas.height };
    } finally {
      URL.revokeObjectURL(url);
    }
  },
  async addImagePage(doc, blob, label){
    const {dataUrl, width, height} = await SV.pdf.imageBlobToJpeg(blob);
    doc.addPage();
    const state = SV.pdf.newState(doc);
    SV.pdf.text(state, label, {bold:true, size:11, after:3});
    const maxW = state.pageW - 2*SV.pdf.MARGIN;
    const maxH = state.pageH - state.y - SV.pdf.MARGIN;
    const scale = Math.min(maxW/width, maxH/height, 1);
    doc.addImage(dataUrl, "JPEG", SV.pdf.MARGIN, state.y, width*scale, height*scale);
  },
  // Verarbeitet eine Liste gesammelter Anhang-Referenzen ({label, attachmentId, kind})
  // in Reihenfolge: Bilder als zusaetzliche jsPDF-Seiten, PDFs am Ende per
  // pdf-lib echt zusammengefuegt. Gibt die fertigen PDF-Bytes zurueck.
  async appendAttachments(doc, teamId, refs){
    const pdfRefs = [];
    for(const ref of refs){
      if(ref.kind !== "bild") continue;
      try{
        const blob = await SV.store.getAttachmentBlob(teamId, ref.attachmentId);
        if(!blob) throw new Error(SV.t("toast_attachment_not_found"));
        await SV.pdf.addImagePage(doc, blob, ref.label);
      }catch(e){
        doc.addPage();
        const s = SV.pdf.newState(doc);
        SV.pdf.text(s, SV.t("pdf_insert_failed", ref.label), {bold:true});
      }
    }
    for(const ref of refs){ if(ref.kind === "pdf") pdfRefs.push(ref); }
    const jspdfBytes = doc.output("arraybuffer");
    if(!pdfRefs.length || !window.PDFLib) return jspdfBytes;
    const merged = await window.PDFLib.PDFDocument.load(jspdfBytes);
    const pages = merged.getPages();
    const refSize = pages.length ? pages[0].getSize() : {width:595.28, height:841.89};
    const font = await merged.embedFont(window.PDFLib.StandardFonts.HelveticaBold);
    const marginPt = SV.pdf.MARGIN * 2.8346;
    for(const ref of pdfRefs){
      try{
        const blob = await SV.store.getAttachmentBlob(teamId, ref.attachmentId);
        if(!blob) throw new Error(SV.t("toast_attachment_not_found"));
        const srcBytes = await blob.arrayBuffer();
        const sep = merged.addPage([refSize.width, refSize.height]);
        sep.drawText(ref.label, { x: marginPt, y: refSize.height - marginPt - 10, size: 13, font });
        const srcDoc = await window.PDFLib.PDFDocument.load(srcBytes);
        const copied = await merged.copyPages(srcDoc, srcDoc.getPageIndices());
        copied.forEach(p=>merged.addPage(p));
      }catch(e){
        const sep = merged.addPage([refSize.width, refSize.height]);
        sep.drawText(SV.t("pdf_insert_failed", ref.label), { x: marginPt, y: refSize.height - marginPt - 10, size: 11, font });
      }
    }
    return merged.save();
  },
  downloadPdfBytes(bytes, filename){
    SV.util.downloadBlob(new Blob([bytes], {type:"application/pdf"}), filename);
  },

  async agendaPdf(agendaId){
    const teamId = SV.state.currentTeamId;
    const agenda = await SV.store.getAgenda(teamId, agendaId);
    const doc = SV.pdf.newDoc("P");
    const state = SV.pdf.newState(doc);
    SV.pdf.header(state, SV.t("pdf_agenda_title", agenda.title||SV.t("no_title")), agenda.date?SV.t("pdf_date_label", SV.util.dmy(agenda.date)):"");
    const attachmentRefs = [];
    SV.model.numberedItems(agenda.items).forEach(({item,number,depth})=>{
      SV.pdf.text(state, `${number}. ${item.title}${item.public?"":SV.t("pdf_not_public_suffix")}`, {bold:true, indent: depth*6, before:3});
      item.blocks.forEach(b=> SV.pdf.segments(state, b.content, depth*6+4));
      (item.anhaenge||[]).filter(at=>at.display!=="verborgen").forEach(at=>{
        const n = attachmentRefs.length+1;
        const label = SV.t("pdf_attachment_label_n", n, SV.pdf.attachmentLabel(at));
        attachmentRefs.push({label, attachmentId:at.id, kind:at.kind});
        SV.pdf.text(state, SV.t("pdf_see_attachment", n, SV.pdf.attachmentLabel(at)), {indent:depth*6+4, size:9.5, after:2});
      });
    });
    const bytes = await SV.pdf.appendAttachments(doc, teamId, attachmentRefs);
    SV.pdf.downloadPdfBytes(bytes, SV.t("pdf_filename_agenda", agenda.date||SV.t("pdf_filename_no_date")));
  },

  async protocolPdf(meetingId, full){
    const teamId = SV.state.currentTeamId;
    const meeting = await SV.store.getMeeting(teamId, meetingId);
    const doc = SV.pdf.newDoc("P");
    const state = SV.pdf.newState(doc);
    SV.pdf.header(state, SV.t("pdf_protocol_title", meeting.title||SV.t("no_title")),
      (meeting.date?SV.t("pdf_date_label", SV.util.dmy(meeting.date)):"") + (full?SV.t("pdf_full_version"):SV.t("pdf_public_version")));
    const attachmentRefs = [];
    SV.model.numberedItems(meeting.items).forEach(({item,number,depth})=>{
      if(!full && !item.public) return;
      SV.pdf.text(state, `${number}. ${item.title}`, {bold:true, size:12.5, indent:depth*6, before:4});
      if(full && meeting.showTimerInProtocol){
        const ms = SV.timer.liveElapsedMs(item);
        if(ms > 0) SV.pdf.text(state, SV.t("pdf_duration_line", SV.timer.fmt(ms)), {indent:depth*6+4, size:9.5, after:2});
      }
      // Vorbereitungs-Bloecke ("prep") sind bewusst nur in der App sichtbar,
      // nicht im Protokoll (s. "Weitere kleinere Aenderungen", Version 1.7.0).
      item.blocks.filter(b=>b.kind!=="prep").forEach(b=> SV.pdf.segments(state, b.content, depth*6+4));
      item.antraege.forEach(a=>{
        SV.pdf.text(state, SV.t("pdf_antrag_label"), {bold:true, indent:depth*6+4, before:2});
        SV.pdf.segments(state, a.antrag_text, depth*6+4);
        SV.pdf.text(state, SV.t("pdf_beschluss_label"), {bold:true, indent:depth*6+4, before:2});
        SV.pdf.segments(state, a.beschluss_text, depth*6+4);
        SV.pdf.text(state, SV.t("pdf_ergebnis_line", SV.beschluss.label(a.ergebnis), a.dafuer, a.dagegen, a.enthaltung), {indent:depth*6+4, size:9.5, after:2});
      });
      item.aufgaben.forEach(t=>{
        SV.pdf.text(state, SV.t("pdf_aufgabe_label"), {bold:true, indent:depth*6+4, before:2});
        SV.pdf.segments(state, t.text, depth*6+4);
        SV.pdf.text(state, SV.t("pdf_aufgabe_line", t.verantwortlich, SV.util.dmy(t.termin), SV.aufgaben.statusLabel(t.status)), {indent:depth*6+4, size:9.5, after:2});
      });
      (item.anhaenge||[]).filter(at=>at.display!=="verborgen").forEach(at=>{
        const n = attachmentRefs.length+1;
        const label = SV.t("pdf_attachment_label_n", n, SV.pdf.attachmentLabel(at));
        attachmentRefs.push({label, attachmentId:at.id, kind:at.kind});
        SV.pdf.text(state, SV.t("pdf_see_attachment", n, SV.pdf.attachmentLabel(at)), {indent:depth*6+4, size:9.5, after:2});
      });
    });
    const bytes = await SV.pdf.appendAttachments(doc, teamId, attachmentRefs);
    SV.pdf.downloadPdfBytes(bytes, SV.t("pdf_filename_protocol", meeting.date||SV.t("pdf_filename_no_date"), full?"":SV.t("pdf_filename_public_suffix")));
  },

  beschlusslistePdf(entries, format){
    const doc = SV.pdf.newDoc("P");
    const state = SV.pdf.newState(doc);
    SV.pdf.header(state, SV.t("pdf_beschlussliste_title"));

  aufgabenlistePdf(entries, format, orientation){

        SV.util.dmy(e.task.termin), SV.aufgaben.statusLabel(e.task.status),
      ]), colWidths);
    } else {
      entries.forEach(e=>{

      });

/* ===================== Altprotokoll-Import (Phase 3) =====================
   Liest .docx/.odt/.pdf/.xlsx-Dateien rein clientseitig (kein Server) und
   wandelt sie in eine gemeinsame Zwischenform um: eine flache Liste von
   Textzeilen in Dokumentreihenfolge (Tabellenzeilen werden zu einer Zeile
   "Zelle | Zelle | ...", damit nichts an Struktur verloren geht, aber alles
   als einfacher Text weiterverarbeitet werden kann). Darauf setzen die
   Erkennungs-Heuristiken (TOPs/Beschlüsse/Aufgaben) auf - siehe weiter unten. */
SV.importer = {
  async loadZipXml(file, xmlPath){
    const zip = await window.JSZip.loadAsync(file);
    const entry = zip.file(xmlPath);
    if(!entry) throw new Error(SV.t("err_xml_not_found", xmlPath));
    const xmlText = await entry.async("string");
    return new DOMParser().parseFromString(xmlText, "application/xml");
  },
  async parseDocx(file){
    const doc = await SV.importer.loadZipXml(file, "word/document.xml");
    const body = doc.getElementsByTagName("w:body")[0];
    if(!body) throw new Error(SV.t("err_docx_no_body"));
    const lines = [];
    const walk = (node)=>{
      for(const child of Array.from(node.children||[])){
        const tag = child.tagName;
        if(tag === "w:tr"){
          const cells = Array.from(child.getElementsByTagName("w:tc")).map(c=>(c.textContent||"").trim());
          lines.push(cells.join(" | "));
        } else if(tag === "w:p"){
          lines.push((child.textContent||"").trim());
        } else if(child.getElementsByTagName("w:p").length || child.getElementsByTagName("w:tr").length){
          walk(child); // z.B. w:tbl - Zeilen/Absaetze liegen eine Ebene tiefer
        }
      }
    };
    walk(body);
    return lines;
  },
  async parseOdt(file){
    const doc = await SV.importer.loadZipXml(file, "content.xml");
    const body = doc.getElementsByTagName("office:text")[0];
    if(!body) throw new Error(SV.t("err_odt_no_body"));
    const lines = [];
    const walk = (node)=>{
      for(const child of Array.from(node.children||[])){
        const tag = child.tagName;
        if(tag === "table:table-row"){
          const cells = Array.from(child.getElementsByTagName("table:table-cell")).map(c=>(c.textContent||"").trim());
          lines.push(cells.join(" | "));
        } else if(tag === "text:p" || tag === "text:h"){
          lines.push((child.textContent||"").trim());
        } else if(child.getElementsByTagName("text:p").length || child.getElementsByTagName("text:h").length || child.getElementsByTagName("table:table-row").length){
          walk(child);
        }
      }
    };
    walk(body);
    return lines;
  },
  async parsePdf(file){
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
    const lines = [];
    const flushLine = (raw)=>{
      const t = raw.replace(/\s+/g, " ").trim();
      if(t) lines.push(t);
    };
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let lastY = null, line = "";
      for(const item of content.items){
        const y = item.transform[5];
        if(lastY !== null && Math.abs(y - lastY) > 2){
          flushLine(line);
          line = "";
        }
        line += (line ? " " : "") + item.str;
        lastY = y;
      }
      flushLine(line);
      lines.push(""); // Leerzeile als Seitenumbruch-Markierung
    }
    return lines;
  },
  async parseXlsx(file){
    const zip = await window.JSZip.loadAsync(file);
    // Gemeinsame Zeichenketten (sharedStrings.xml) - optional, manche xlsx
    // schreiben Zellwerte auch inline.
    let shared = [];
    const sharedEntry = zip.file("xl/sharedStrings.xml");
    if(sharedEntry){
      const sdoc = new DOMParser().parseFromString(await sharedEntry.async("string"), "application/xml");
      shared = Array.from(sdoc.getElementsByTagName("si")).map(si=>(si.textContent||"").trim());
    }
    const sheetNames = zip.file(/xl\/worksheets\/sheet\d+\.xml/).map(f=>f.name).sort();
    if(!sheetNames.length) throw new Error(SV.t("err_no_sheets"));
    const lines = [];
    for(const name of sheetNames){
      const sdoc = new DOMParser().parseFromString(await zip.file(name).async("string"), "application/xml");
      for(const row of Array.from(sdoc.getElementsByTagName("row"))){
        const cells = Array.from(row.getElementsByTagName("c")).map(c=>{
          const t = c.getAttribute("t");
          const vEl = c.getElementsByTagName("v")[0];
          const v = vEl ? vEl.textContent : "";
          if(t === "s") return shared[+v] || "";
          if(t === "inlineStr"){ const isEl = c.getElementsByTagName("t")[0]; return isEl ? (isEl.textContent||"") : ""; }
          return v;
        });
        lines.push(cells.join(" | "));
      }
      lines.push(""); // Blatt-Ende als Leerzeile
    }
    return lines;
  },
  // Einstiegspunkt: anhand der Dateiendung den passenden Parser waehlen.
  async parseFile(file){
    const ext = (file.name.split(".").pop()||"").toLowerCase();
    if(ext === "docx") return SV.importer.parseDocx(file);
    if(ext === "odt") return SV.importer.parseOdt(file);
    if(ext === "pdf") return SV.importer.parsePdf(file);
    if(ext === "xlsx") return SV.importer.parseXlsx(file);
    throw new Error(SV.t("err_unsupported_fileformat"));
  },

  /* ---------- Heuristische Erkennung (bewusst grosszuegig: lieber zu viel
     als zu wenig in den Vorschlag aufnehmen - der Review-Schritt vor dem
     Speichern laesst Falsches verwerfen; ein ganz verpasster Beschluss waere
     schlimmer, siehe Nutzerwunsch "wichtig, dass Beschlüsse gerettet werden"). */
  TOP_HEADING_RE: /^(?:tagesordnungspunkt|top|punkt)\s*\d+\b[:.)]?\s*(.*)$/i,
  NUMBERED_HEADING_RE: /^(\d{1,2})[.)]\s+(\S.*)$/,

  // Teilt die flache Zeilenliste eines Dokuments in TOP-Kandidaten. Alles vor
  // der ersten erkannten Ueberschrift (z.B. Anwesenheitsliste) landet in einem
  // ersten Sammel-Segment "Allgemein", damit nichts verloren geht.
  segmentIntoTops(lines){
    const segments = [];
    let current = { title: SV.t("seg_default_title"), lines: [] };
    const pushCurrent = ()=>{ if(current.lines.some(l=>l.trim())) segments.push(current); };
    for(const raw of lines){
      const trimmed = raw.trim();
      let title = null;
      let m = SV.importer.TOP_HEADING_RE.exec(trimmed);
      if(m){
        title = m[1].trim() || trimmed;
      } else {
        m = SV.importer.NUMBERED_HEADING_RE.exec(trimmed);
        // Nur als Ueberschrift werten, wenn kurz und ohne mehrere Satzzeichen
        // (sonst waere es vermutlich eine normale Aufzaehlung im Fliesstext).
        if(m && trimmed.length <= 70 && !/[.;:]\s*\S.*[.;:]\s*\S/.test(trimmed)){
          title = m[2].trim();
        }
      }
      if(title !== null){
        pushCurrent();
        current = { title, lines: [] };
      } else {
        current.lines.push(raw);
      }
    }
    pushCurrent();
    return segments;
  },

  VOTE_RE: /daf[uü]r\s*[:=]?\s*(\d+)[^\d]{0,15}dagegen\s*[:=]?\s*(\d+)(?:[^\d]{0,20}enthaltung(?:en)?\s*[:=]?\s*(\d+))?/i,
  ERGEBNIS_PATTERNS: [
    [/einstimmig/i, "angenommen"],
    [/mehrheitlich/i, "angenommen"],
    [/angenommen/i, "angenommen"],
    [/abgelehnt/i, "abgelehnt"],
    [/vertagt/i, "vertagt"],
    [/zur[uü]ckgezogen/i, "zurückgezogen"],
  ],
  guessErgebnis(text){
    for(const [re, val] of SV.importer.ERGEBNIS_PATTERNS) if(re.test(text)) return val;
    return "offen";
  },
  normalizeDate(d){
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec((d||"").trim());
    if(!m) return "";
    let [, dd, mm, yyyy] = m;
    if(yyyy.length === 2) yyyy = "20"+yyyy;
    return `${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
  },

  // Sucht in den Zeilen EINES TOP-Segments nach Antrag/Beschluss-Hinweisen.
  // "hoch" = explizit beschriftete "Antrag:"/"Beschluss:"-Zeile gefunden;
  // "niedrig" = nur Signalwoerter ohne Beschriftung (muss im Review bestaetigt
  // oder von Hand nachgebessert werden).
  findBeschluesse(lines){
    const text = lines.join(" ");
    let antragText = null, beschlussText = null, voteLine = "";
    for(const line of lines){
      const trimmed = line.trim();
      const am = /^antrag\s*[:\-]\s*(.*)$/i.exec(trimmed);
      if(am){ antragText = am[1].trim(); continue; }
      const bm = /^beschluss\s*[:\-]\s*(.*)$/i.exec(trimmed);
      if(bm){ beschlussText = bm[1].trim(); continue; }
      if(/daf[uü]r|dagegen|enthaltung|abstimmung/i.test(trimmed)) voteLine += " " + trimmed;
    }
    if(antragText || beschlussText){
      const vm = SV.importer.VOTE_RE.exec(voteLine) || SV.importer.VOTE_RE.exec(text);
      return [{
        antrag_text: antragText || "",
        beschluss_text: beschlussText || "",
        ergebnis: SV.importer.guessErgebnis(voteLine || text),
        dafuer: vm ? (+vm[1]||0) : 0,
        dagegen: vm ? (+vm[2]||0) : 0,
        enthaltung: (vm && vm[3]) ? (+vm[3]||0) : 0,
        confidence: "hoch",
        quelle: lines.join("\n"),
      }];
    }
    if(/beschluss|beschlossen|\bantrag\b/i.test(text)){
      const vm = SV.importer.VOTE_RE.exec(text);
      return [{
        antrag_text: text.slice(0, 500),
        beschluss_text: "",
        ergebnis: SV.importer.guessErgebnis(text),
        dafuer: vm ? (+vm[1]||0) : 0,
        dagegen: vm ? (+vm[2]||0) : 0,
        enthaltung: (vm && vm[3]) ? (+vm[3]||0) : 0,
        confidence: "niedrig",
        quelle: lines.join("\n"),
      }];
    }
    return [];
  },

  // Sucht Aufgaben-Hinweise (Zusatz, geringere Priorität als Beschlüsse).
  findAufgaben(lines){
    const out = [];
    const text = lines.join(" ");
    const vm = /verantwortlich\s*[:\-]?\s*([^,·\n]+)/i.exec(text);
    const tm = /termin\s*[:\-]?\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i.exec(text)
      || /\bbis\s+(?:zum\s+)?(\d{1,2}\.\d{1,2}\.\d{2,4})/i.exec(text);
    for(const line of lines){
      const am = /^aufgabe\s*[:\-]\s*(.*)$/i.exec(line.trim());
      if(am){
        out.push({
          text: am[1].trim(),
          verantwortlich: vm ? vm[1].trim() : "",
          termin: tm ? SV.importer.normalizeDate(tm[1]) : "",
          confidence: "hoch",
        });
      }
    }
    return out;
  },
};

/* ---------- Import-Vorschau/Review-UI (vor dem Speichern) ----------
   Der Entwurf liegt nur im Arbeitsspeicher (SV.state._importDraft), bis
   "Import abschließen" gedrückt wird - nichts wird vorher in IndexedDB
   geschrieben. */
SV.views.importStart = function(app){
  app.innerHTML = `
    <p><a href="#/meetings">${SV.t("back_to_meetings")}</a></p>
    <h1>${SV.t("import_start_h1")}</h1>
    <div class="card">
      <p class="muted small">${SV.t("import_start_desc")}</p>
      <div class="row">
        <div><label>${SV.t("label_file")}</label><input type="file" id="importFile" accept=".docx,.odt,.pdf,.xlsx"></div>
        <div><label>${SV.t("label_meeting_title")}</label><input type="text" id="importTitle" placeholder="${SV.t("placeholder_import_title")}"></div>
        <div><label>${SV.t("label_date_optional")}</label><input type="date" id="importDate"></div>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button onclick="SV.actions.importFile()">${SV.t("btn_read_file")}</button>
      </div>
      <div id="importStatus" class="small muted" style="margin-top:6px;"></div>
    </div>
  `;
};

SV.actions.importFile = async function(){
  const fileInput = SV.util.byId("importFile");
  const file = fileInput.files && fileInput.files[0];
  const statusEl = SV.util.byId("importStatus");
  if(!file){ SV.ui.toast(SV.t("toast_select_file")); return; }
  statusEl.textContent = SV.t("status_reading_file");
  try{
    const lines = await SV.importer.parseFile(file);
    const segments = SV.importer.segmentIntoTops(lines).map(seg=>{
      const beschluesse = SV.importer.findBeschluesse(seg.lines).map(b=>Object.assign({use: b.confidence==="hoch"}, b));
      const aufgaben = SV.importer.findAufgaben(seg.lines).map(a=>Object.assign({use: true}, a));
      return { title: seg.title, text: seg.lines.join("\n"), keep: true, beschluesse, aufgaben };
    });
    if(!segments.length){ statusEl.textContent = SV.t("status_no_usable_text"); return; }
    const title = SV.util.byId("importTitle").value.trim() || file.name.replace(/\.[^.]+$/, "");
    const date = SV.util.byId("importDate").value || "";
    SV.state._importDraft = { title, date, sourceName: file.name, segments };
    location.hash = "#/import/review";
  }catch(e){
    statusEl.textContent = SV.t("status_read_error", e.message);
  }
};

SV.views.importReview = function(app){
  const draft = SV.state._importDraft;
  if(!draft){ location.hash = "#/import"; return; }
  const ergOptions = (selected)=> SV.beschluss.ERG.map(e=>`<option value="${e.value}" ${e.value===selected?"selected":""}>${SV.beschluss.label(e.value)}</option>`).join("");
  const segHtml = draft.segments.map((seg,i)=>{
    const bHtml = seg.beschluesse.map((b,j)=>`
      <div class="list-item" style="border-left:3px solid var(--blue);">
        <label style="display:inline;"><input type="checkbox" id="imp-b-use-${i}-${j}" ${b.use?"checked":""} style="width:auto;">
          ${SV.t("label_use_as_beschluss")}</label>
        ${b.confidence==="niedrig"?`<span class="tag">${SV.t("tag_uncertain")}</span>`:''}
        <label>${SV.t("label_antrag")}</label><textarea id="imp-b-antrag-${i}-${j}">${SV.util.esc(b.antrag_text)}</textarea>
        <label>${SV.t("label_beschluss")}</label><textarea id="imp-b-beschluss-${i}-${j}">${SV.util.esc(b.beschluss_text)}</textarea>
        <div class="row" style="margin-top:4px;">
          <div><label>${SV.t("label_ergebnis")}</label><select id="imp-b-ergebnis-${i}-${j}">${ergOptions(b.ergebnis)}</select></div>
          <div><label>${SV.t("label_dafuer")}</label><input type="number" min="0" id="imp-b-dafuer-${i}-${j}" value="${b.dafuer}"></div>
          <div><label>${SV.t("label_dagegen")}</label><input type="number" min="0" id="imp-b-dagegen-${i}-${j}" value="${b.dagegen}"></div>
          <div><label>${SV.t("label_enthaltung")}</label><input type="number" min="0" id="imp-b-enth-${i}-${j}" value="${b.enthaltung}"></div>
        </div>
      </div>`).join("");
    const aHtml = seg.aufgaben.map((a,k)=>`
      <div class="list-item" style="border-left:3px solid var(--blue);">
        <label style="display:inline;"><input type="checkbox" id="imp-a-use-${i}-${k}" ${a.use?"checked":""} style="width:auto;"> ${SV.t("label_use_as_aufgabe")}</label>
        <label>${SV.t("label_task")}</label><textarea id="imp-a-text-${i}-${k}">${SV.util.esc(a.text)}</textarea>
        <div class="row" style="margin-top:4px;">
          <div><label>${SV.t("label_responsible")}</label><input type="text" id="imp-a-ver-${i}-${k}" value="${SV.util.esc(a.verantwortlich)}"></div>
          <div><label>${SV.t("label_due")}</label><input type="date" id="imp-a-ter-${i}-${k}" value="${SV.util.esc(a.termin)}"></div>
        </div>
      </div>`).join("");
    return `
      <div class="card">
        <label style="display:inline;"><input type="checkbox" id="imp-seg-keep-${i}" ${seg.keep?"checked":""} style="width:auto;"> ${SV.t("label_keep_item")}</label>
        <div style="margin-top:4px;"><label>${SV.t("label_title")}</label><input type="text" id="imp-seg-title-${i}" value="${SV.util.esc(seg.title)}"></div>
        <label>${SV.t("label_full_text")}</label>
        <textarea id="imp-seg-text-${i}" style="min-height:90px;">${SV.util.esc(seg.text)}</textarea>
        ${bHtml ? `<h3 class="small">${SV.t("heading_detected_beschluesse")}</h3>${bHtml}` : ""}
        ${aHtml ? `<h3 class="small">${SV.t("heading_detected_aufgaben")}</h3>${aHtml}` : ""}
      </div>`;
  }).join("");

  app.innerHTML = `
    <p><a href="#/import">${SV.t("back_generic")}</a></p>
    <h1>${SV.t("import_review_title", SV.util.esc(draft.sourceName))}</h1>
    <div class="card">
      <p class="muted small">${SV.t("import_review_hint")}</p>
      <div class="row">
        <div><label>${SV.t("label_meeting_title")}</label><input type="text" id="imp-title" value="${SV.util.esc(draft.title)}"></div>
        <div><label>${SV.t("label_date_optional")}</label><input type="date" id="imp-date" value="${SV.util.esc(draft.date)}"></div>
      </div>
    </div>
    ${segHtml}
    <div class="btn-row">
      <button onclick="SV.actions.importCommit()">${SV.t("btn_import_commit")}</button>
      <button class="secondary" onclick="SV.actions.importCancel()">${SV.t("btn_cancel")}</button>
    </div>
  `;
  SV.util.installAutoGrow(app);
};

SV.actions.importCommit = async function(){
  const draft = SV.state._importDraft;
  if(!draft) return;
  const teamId = SV.state.currentTeamId;
  const title = SV.util.byId("imp-title").value.trim() || draft.title;
  const date = SV.util.byId("imp-date").value || draft.date || "";
  const meeting = SV.model.newMeeting(date, title, null);
  meeting.status = "abgeschlossen";
  meeting.completed_at = SV.util.nowIso();
  let order = 0;
  draft.segments.forEach((seg,i)=>{
    const keep = SV.util.byId(`imp-seg-keep-${i}`).checked;
    if(!keep) return;
    const segTitle = SV.util.byId(`imp-seg-title-${i}`).value.trim() || seg.title;
    const segText = SV.util.byId(`imp-seg-text-${i}`).value;
    const item = SV.model.newMeetingItem(segTitle, {order: order++});
    if(segText.trim()) item.blocks.push(SV.model.newBlock(segText));
    seg.beschluesse.forEach((b,j)=>{
      if(!SV.util.byId(`imp-b-use-${i}-${j}`).checked) return;
      item.antraege.push(SV.model.newAntrag({
        antrag_text: SV.util.byId(`imp-b-antrag-${i}-${j}`).value,
        beschluss_text: SV.util.byId(`imp-b-beschluss-${i}-${j}`).value,
        ergebnis: SV.util.byId(`imp-b-ergebnis-${i}-${j}`).value,
        dafuer: +SV.util.byId(`imp-b-dafuer-${i}-${j}`).value || 0,
        dagegen: +SV.util.byId(`imp-b-dagegen-${i}-${j}`).value || 0,
        enthaltung: +SV.util.byId(`imp-b-enth-${i}-${j}`).value || 0,
      }));
    });
    seg.aufgaben.forEach((a,k)=>{
      if(!SV.util.byId(`imp-a-use-${i}-${k}`).checked) return;
      const text = SV.util.byId(`imp-a-text-${i}-${k}`).value.trim();
      if(!text) return;
      const ver = SV.util.byId(`imp-a-ver-${i}-${k}`).value.trim();
      const ter = SV.util.byId(`imp-a-ter-${i}-${k}`).value;
      item.aufgaben.push(SV.model.newTask(text, ver, ter));
    });
    meeting.items.push(item);
  });
  if(!meeting.items.length){ SV.ui.toast(SV.t("toast_need_one_item")); return; }
  await SV.store.saveMeeting(teamId, meeting);
  SV.state._importDraft = null;
  location.hash = "#/meetings/"+meeting.id;
};
SV.actions.importCancel = function(){
  SV.state._importDraft = null;
  location.hash = "#/meetings";
};

/* ===================== Hilfe ===================== */
// Beschriftungen/Inhalte kommen live aus SV.i18n.DICT (SV.t), damit die
// Hilfe beim Sprachwechsel ohne Dopplung mitübersetzt wird.
SV.help = {
  TAB_KEYS: ["bedienung", "installation", "datenschutz", "ueber"],
  labelKey: {bedienung:"help_tab_bedienung", installation:"help_tab_installation", datenschutz:"help_tab_datenschutz", ueber:"help_tab_ueber"},
  htmlKey: {bedienung:"help_html_bedienung", installation:"help_html_installation", datenschutz:"help_html_datenschutz", ueber:"help_html_ueber"},
  activeTab: "bedienung",
};
SV.ui.openHelp = function(){
  const tabsEl = SV.util.byId("helpTabs");
  tabsEl.innerHTML = SV.help.TAB_KEYS.map(k=>
    `<button class="${SV.help.activeTab===k?'active':''}" onclick="SV.ui.showHelpTab('${k}')">${SV.t(SV.help.labelKey[k])}</button>`
  ).join("");
  SV.ui.showHelpTab(SV.help.activeTab);
  SV.util.byId("helpdlg").showModal();
};
SV.ui.showHelpTab = function(k){
  SV.help.activeTab = k;
  SV.util.byId("helpBody").innerHTML = SV.t(SV.help.htmlKey[k]);
  SV.util.qsa("#helpTabs button").forEach(b=>b.classList.remove("active"));
  const idx = SV.help.TAB_KEYS.indexOf(k);
  const btn = SV.util.qsa("#helpTabs button")[idx];
  if(btn) btn.classList.add("active");
};

/* ===================== App-Start / Service Worker ===================== */
SV.app = {
  swReg: null,
  async applyUpdate(){
    if(SV.app.swReg && SV.app.swReg.waiting){
      SV.app.swReg.waiting.postMessage("skipWaiting");
    }
    window.location.reload();
  },
  async registerSW(){
    if(!("serviceWorker" in navigator)) return;
    try{
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      SV.app.swReg = reg;
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            SV.util.byId("updatebar").style.display = "block";
          }
        });
      });
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }catch(e){ console.warn("SW-Registrierung fehlgeschlagen", e); }
  },
  init(){
    SV.i18n.init();
    SV.settings.init();
    SV.app.registerSW();
    SV.router.go();
  },
};
document.addEventListener("DOMContentLoaded", SV.app.init);
